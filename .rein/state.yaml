  T-068:
    status: done
    attempts: 18
    completed_commit: 199701a6bda90c68c9f66ac610f271a7650b98ff
    handoff:
      review:
        findings:
        - severity: must_fix
          statement: A-2 は「分類のプロンプトとスキーマのダイジェストが今のコードと一致する(古いコードで取った記録は赤)」を求めるが、分類のダイジェストを壊して赤になることを確かめるテストが無い。要約・想起素材・判定にはそれぞれ
            test_record_taken_with_another_*_prompt_is_red があるのに、ADR-029 で実際に変わった分類だけが抜けている。check_recall_passed
            の照合の組から ('分類のプロンプトとスキーマのダイジェスト', 'classify_digest') を消す変異を入れても、どのテストも赤にならない。code_conditions()['classify_digest']
            を別の値に差し替えた記録で、'分類のプロンプトとスキーマのダイジェスト が今のコードの値と違う' が出ることを確かめるテストを足す。
          anchor: tests/measurements/test_recall_rehearsal_logs.py:828
        - severity: must_fix
          statement: test_record_with_a_failed_recall_is_red は名前も docstring も recall の失敗を言うが、壊しているのは _sections(text,
            '実行 ')[-1]、つまり STAGES を広げた今は script の実行(実行 3)である。recall 段の exit 0 を確かめるテストは無い。check_recall_passed
            の exit 0 のループを executions[-1:] に絞る変異を入れても、recall が exit 1 の記録は緑のまま通る。A-2 は recall 段と script
            段の両方の exit 0 を求めているので、recall の節(stage が recall の節)を壊すテストと script の節を壊すテストを分け、名前を中身に合わせる。
          anchor: tests/measurements/test_recall_rehearsal_logs.py:818
        - severity: must_fix
          statement: A-3 の「段ごとの呼び出し数・トークン数」と「utilization の生の値も併記する(D-218)」には、赤になることを確かめるテストが無い。壊すテストは、合計のトークン数の外挿(test_record_with_a_wrong_extrapolation_is_red)、推定使用率(test_record_with_a_wrong_estimate_is_red)、再生成の欠け(test_record_missing_a_regeneration_is_red)の3本だけである。check_usage_recorded
            から段ごとの比較のループ(711-718行)か utilization の生の値の assert(731行)を消す変異を入れても、どのテストも赤にならない。段の行の呼び出し数を変えた記録と、レート枠の表の開始時の
            utilization を変えた記録のそれぞれで、狙った判定が赤になることを確かめるテストを足す。
          anchor: tests/measurements/test_recall_rehearsal_logs.py:731
        - severity: must_fix
          statement: _rehearse の docstring が「cluster を新しい列で、続けて recall を同じ列で走らせる」のまま残っている。実装は STAGES[1:]
            で recall と script を走らせ、その後 _mutate も呼ぶので、記述が実装と食い違っている。モジュールの docstring(8-15行)に合わせて書き直す。
          anchor: tests/measurements/test_recall_rehearsal_logs.py:240
      updated_at: '2026-10-15T04:50:17+09:00'
