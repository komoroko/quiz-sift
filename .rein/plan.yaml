- id: D-228
  subject: argv の変更と、それで古くなる記録の取り直しを分けるか
  reach: local
  status: settled
  settled_by: loop
  answer: 1本のホストのタスク(T-060)にまとめる。argv の変更、最終 argv での init.tools と番兵の実測、契約フィクスチャと home-probe、固定オーバーヘッドの較正を同じタスクで行う。
  rationale: argv を変えると契約フィクスチャと overhead の定数を読むテストが赤になり、別タスクにすると間のタスクの DoD が赤になる(AR-T4、AR-T9)。タスクの切り方だけで、claim
    は動かない。
  requirement_ids:
  - NFR-8
  - NFR-7
- id: D-229
  subject: 人のタスクの記録を判定するテストのノード
  reach: local
  status: settled
  settled_by: loop
  answer: 記録を作る道具のタスク(T-057、T-070)が作り、記録がまだコミットされていない間は skip する。人のタスクは artifact の基準で記録の存在を求め、そのうえでノードが判定する。
  rationale: ノードを作る持ち主が無いと人のタスクの基準が not found で赤になり、記録が無い間に assert すると並行タスクの DoD が赤になる(AR-T5)。テストの書き方だけ。
  requirement_ids:
  - R-2
  - NFR-7
