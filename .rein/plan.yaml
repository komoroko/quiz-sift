  - id: A-2
    statement: '列の status と not_completable_reasons が次の表のとおりになる(D-145)。completed: fresh → レート枠で停止 → resume で audio を exit 0。resumable: 最後の実行がレート枠で停止した列、最後が recall で exit 0 の列。not_completable: 最初の実行が fresh でない、途中の実行が非 0 でレート枠による停止でない(ended_by_rate_limit が偽)、overage_invocations > 0、metered_env_names が空でない実行がある、閉じていない開始行(いま締めている実行を除く)がある、のそれぞれ。存在しない run_id を問い合わせるとエラーになる。'
