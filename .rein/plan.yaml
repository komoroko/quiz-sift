  subject: サイクルの起点(cycle.base_commit)
  reach: mandate
  status: settled
  settled_by: human
  answer: 'mandate 前の環境の準備(6328141: 脆弱性の修正と記録の写し戻し)の後にする。写し戻した前サイクルの PNG がレビューの差分に入らないようにするため。0.13 への移行と事前許可の削除(2a5d12e、44d0f7f)と要件・設計の文書は差分の外になる。人が
    base_commit の書き換えを許可した。'
