cycle:
  id: quiz-sift
  base_commit: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
  branch: build/quiz-sift
scope:
  include:
  - src/quiz_sift/ports/
  - src/quiz_sift/adapters/
  - src/quiz_sift/pipeline/
  - src/quiz_sift/safety/
  - src/quiz_sift/cluster/summary.py
  - src/quiz_sift/cli.py
  - src/quiz_sift/composition.py
  - pyproject.toml
  - uv.lock
  - tests/
  - docs/
claims:
- id: C-001
  requirement_ids:
  - R-1
  statement: 構造化ファイルから100〜200問を取り込むと、取り込めた全問の問題文・選択肢4件・正解が欠落なく保持され、既習フラグは個別指定→セット指定の順で解決されどちらも無い場合のみ unknown
    として記録され、不正な問題は個別に列挙され、正常系フィクスチャに対する除外件数は 0 で、公式解説の有無の件数が報告される。
  risk: high
  domains:
  - ingest
- id: C-002
  requirement_ids:
  - R-2
  statement: Udemy のページからヘッドレスブラウザで抽出すると、成功件数と失敗箇所が報告され、受験者の選択と正解が異なる問題を3件以上含むゴールデンセット10件に対する正解ラベル一致率が
    100% で、正解判定の根拠の要素種別が全問で同一であることが機械判定される。
  risk: high
  domains:
  - ingest
- id: C-003
  requirement_ids:
  - R-3
  statement: 問題群は排他クラスタへまとめられ、M/N・未分類比率・最大クラスタ比率が記録され、既知5グループのフィクスチャに対し最大クラスタ比率が 50% を超えず「その他」比率が 20%
    以下であり、各クラスタに全問題 ID の一覧と要約が付き、要約の主要な語句がそのクラスタの問題文中に実在する。キャッシュを迂回した2回の再クラスタリングについて割当一致率が記録され、その2回の llm_calls(Protocol
    呼び出し数であって子プロセス数ではない)が1回分の2倍になる。外部 LLM 呼び出しに失敗があった実行は下流ステージへ進まず非 0 終了する。失敗の種別は SPAWN / TIMEOUT / PARSE
    / SCHEMA / TRUNCATED / INCOMPLETE_IDS / PROVIDER_ERROR の7種で、レート制限と isUsingOverage が真の呼び出しは PROVIDER_ERROR
    として失敗に数えられ、1回の実行の実経過時間が12時間を超えると非 0 終了し、それまでに rate_limit_event が届いていれば最後の resetsAt がログに残る。PARSE は
    stdout が result イベントをちょうど1つ含む JSON のイベント列にならないことで判定し終了コードと stderr を使わず、TRUNCATED は subtype が error_max_turns
    か stop_reason が max_tokens / model_context_window_exceeded のときに限る。渡した問題 ID のうち応答に現れなかった ID が1件以上ある呼び出しは失敗とする。再試行は行わない。実行のサマリに未分類比率・最大クラスタ比率・失敗件数の3値が出力され、失敗件数が実際の失敗数と一致する。
  risk: high
  domains:
  - analysis
- id: C-004
  requirement_ids:
  - R-4
  statement: 各クラスタの想起キー・答え・識別ポイントが生成され、想起キーと識別ポイントが参照する誤答選択肢は元データに実在し、同一の想起キーが複数クラスタで使われず、全構成要素が他クラスタにも出現するようなキーが
    0 件で、識別ポイントは誤答選択肢の丸写しではない。
  risk: high
  domains:
  - analysis
- id: C-005
  requirement_ids:
  - R-5
  statement: 専門用語のグロッサリが生成され、公式解説との矛盾件数が 0 であり、照合対象が 0 件の場合は合格ではなく照合対象なしとして記録され、音声は想起素材とは別ファイルになる。
  risk: medium
  domains:
  - analysis
- id: C-006
  requirement_ids:
  - R-6
  statement: 台本は『想起の問いかけ→間→答え→識別ポイント』の順で構成され、選択肢ラベルの4件並列提示(記号・番号・かなを問わない)を含まず、『間』は機械可読なマーカーとして表現され、推定再生時間3分を超えたクラスタは打ち切られず分割または再生成のうえ列挙される。
  risk: medium
  domains:
  - content
- id: C-007
  requirement_ids:
  - R-7
  statement: 全クラスタ分の音声が mp3 または m4a で書き出され、先頭と末尾を除く位置に前後を有音区間に挟まれた3秒以上の無音区間が機械判定で確認でき、ゼロ埋め連番のファイル名と m3u
    により端末のソート順で意図した順に並び、記録された言語と TTS のボイス設定が一致し、失敗クラスタは列挙される。
  risk: high
  domains:
  - audio
- id: C-008
  requirement_ids:
  - R-8
  statement: Web UI 上の4択出題で選択・正誤・所要時間が永続記録され、選択肢の内容または ID で同定した入力を問題ごとに異なるシャッフル並びの下で与えたとき全問正解入力が正答率100%・全問誤答入力が0%となり、既習フラグ別の正答率と、hold-out
    不在とテスト効果の両方を明示したレポートが出力される。
  risk: high
  domains:
  - measurement
- id: C-010
  requirement_ids:
  - R-10
  statement: クラスタが誤答率の降順に並んだ再生リストが m3u またはトラック番号付きファイル名として出力され、全問正解時は空リストではなく『該当なし』が明示され、最終学習日時と誤答回数が永続記録される。
  risk: medium
  domains:
  - scheduling
- id: C-011
  requirement_ids:
  - R-11
  statement: 2セット以上の教材を同時に保持しても問題が別セットのクラスタへ混入せず、学習記録とレポートがセット単位で分離され、セット単位で既習/初見を指定できて問題個別の指定がそれを上書きし、日本語本文に英語用語が混在しても
    TTS へ渡せる。
  risk: medium
  domains:
  - data
- id: C-012
  requirement_ids:
  - R-12
  statement: ローカル起動した Web UI からテストの実施と結果の閲覧ができ、回答はブラウザ内ストレージではなくサーバ側の学習記録ストアへ永続化され、そのストアは CLI と UI の双方から読み書きでき所在と形式が一箇所で定義されている。
  risk: high
  domains:
  - ui
- id: C-013
  requirement_ids:
  - NFR-1
  statement: 想起素材・台本・グロッサリ・クラスタ要約が主張する内容が正解ラベルまたは公式解説と矛盾する場合、成果物を出力せずエラー終了する。判定は LLM 含意判定で行い、言い換えに対する誤検出が
    0 件で、ミューテーションに対する検出率が記録される。
  risk: critical
  domains:
  - safety
- id: C-014
  requirement_ids:
  - NFR-2
  statement: 取り込んだ実教材の本文が Git の追跡対象ファイル・コミット・ログ出力のいずれにも含まれない。テスト用の合成フィクスチャはこの対象外である。
  risk: critical
  domains:
  - security
- id: C-015
  requirement_ids:
  - NFR-3
  statement: 外部サービスの認証情報(API キー、Udemy のパスワードとセッションクッキーを含む)がリポジトリに平文で存在せず、ログ・エラーメッセージにも出力されない。
  risk: critical
  domains:
  - security
- id: C-016
  requirement_ids:
  - NFR-4
  statement: 各段階の中間成果物が永続化され、途中段階から再実行したときそれより前の段階の llm_calls と provider_invocations(NFR-7 の定義。HTTP API・CLI
    サブプロセスの別を問わない)がどちらも 0 になる。R-3 の再現性測定はこの対象外とし、ホスト上での実測ログを artifact として記録する。
  risk: high
  domains:
  - pipeline
- id: C-017
  requirement_ids:
  - NFR-5
  statement: uv で依存が同期でき、ruff・mypy strict・pytest・pre-commit が全て通り、GitHub Actions の検査 run ステップがbash gate.sh
    <step> の形をとってその <step> 集合が quality_gate の command ステップ集合と一致し、同じコマンド列が品質ゲート上でローカルに green になり、mkdocs
    build が警告なく完了し、取り込んだ設定が外部パスを参照しない。
  risk: high
  domains:
  - infra
- id: C-018
  requirement_ids:
  - NFR-6
  statement: 品質ゲートのコマンドステップがネットワーク接続なしのサンドボックスで成功する。
  risk: high
  domains:
  - infra
- id: C-019
  requirement_ids:
  - NFR-7
  statement: 100〜200問のフル処理1回(同じ run_id で連なる実行の列。各実行は起動前検査を通った時点で列へ登録され(検査に落ちた起動は列に入らない)終了記録の無い登録はレート枠以外の停止と数えられ、途中の非0終了はその実行で失敗したすべての呼び出しが、result
    が is_error 真で自身の子プロセスが最後に出した rate_limit_event が status rejected かつ isUsingOverage 偽である場合に限り、列全体で isUsingOverage
    真の呼び出しが 0 件であることも完走の条件とし、それ以外の停止を含む列は完走に数えられず、最後の実行が exit 0 で完走。回数・トークン・コストは和、並行度は最大、経過時間は実行時間の和と全体の壁時計の両方、使用率と3つの
    resetsAt は各実行で最初と最後に届いた rate_limit_event の値で届かなければ null と件数)について、実行ごとの値と列の合算値として、経過時間・llm_calls(Protocol
    呼び出し数)・provider_invocations(子プロセス起動数。分割呼び出しを個別に数え、再試行はしない)・model_turns(モデル往復回数、num_turns の総和。レート枠を消費するのはこれ)・並行度・4値トークンの内訳ごとの総量・notional
    コスト・レート制限で終了したか(終了した場合は resetsAt)・および開始時と終了時の両方について five_hour と seven_day 両ウィンドウの utilization と resetsAt
    が、1つのログへ実行ごとに記録される。失敗した呼び出しのトークンも成否の判定より先に記録され、usage が取れなかった呼び出しは件数を別に数える。notional コストは4値トークンと出所を持つ2モデル分の単価表からの自算値と、呼び出し経路が自己申告した
    total_cost_usd の両方、およびその相対差として記録され、いずれかの単価が 0 である間は記録済みとして報告しない。呼び出し経路自身の固定オーバーヘッドはモデルごとに1ターンあたりの定数として持ち、既知長の合成プロンプトを
    k=1,2,3 回反復した較正表の上で Σ_model(overhead_model × turns_model) + material が報告された入力トークン合計に一致し、material は合計からの差し引きで求めない(フル処理の実行ログには
    material を置かない)。その定数は測定日・CLI バージョン・計上先のトークンバケツ・argv のダイジェストを出所として持ち、現 argv のダイジェストと違えば unknown と報告する。出力には
    notional の語が含まれ、実課金額を主張しない。
  risk: medium
  domains:
  - observability
- id: C-020
  requirement_ids:
  - NFR-8
  statement: 本プロダクトの製品コードの実行が従量課金される外部サービス経路を取らない(ハーネス自身の LLM 利用は対象外)。新規インタプリタで、親環境に metered 認証変数が入っており
    anthropic が import 可能な状態で既定構成を1回走らせた後に anthropic が sys.modules に現れず(import 不能な場合は skip せず失敗。選択点を SDK
    アダプタへ差し替えるとこの判定が赤くなる negative control を伴う)、子プロセスへ渡す環境が HOME / PATH / LANG / TZ の4つと一致し HOME は人間が事前に用意した専用の最小ホームを指して製品がその配下に作成したファイルが
    0 件であり、起動前検査が .claude/ 直下の CLAUDE.md・.claude/rules/ 配下のファイル、トップレベルのキーが {theme} の部分集合でない .claude/settings.json、資格情報ファイルの不在のいずれかでエラー終了し(資格情報は開かない)、既定
    Llm の選択点が composition.build_default_llm() ただ1つでその本体が return 文1つかつ右辺がクラス名の直接呼び出しで分岐も動的解決も環境変数参照も含まず、製品として到達可能な入口すべての
    import グラフに metered API へ HTTP を発行しうるモジュールが存在せず、子プロセスの argv が有効ツールの集合を StructuredOutput ただ1つに絞りかつ権限バイパス指定を含まずかつ外部
    MCP 設定を読まない指定を含みかつ作業ディレクトリがその実行のために作った空ディレクトリでありかつ --safe-mode を含み(番兵を置いた実 CLI で CLAUDE.md 系の読み込みが
    0 件であることをホスト実測で示す)、出力形式が stream-json で max-turns が 3 以上であり、列挙した 13 個の metered 認証変数をフル処理の列のすべての実行が持たない状態で完走し、rate_limit_event
    の isUsingOverage が真の呼び出しは PROVIDER_ERROR として失敗に数えられ非 0 終了し、rate_limit_event が届かなかった呼び出しが1件以上あればこの判定を
    unknown と報告する。
  risk: high
  domains:
  - pipeline
  - infra
decisions:
- id: D-001
  subject: サイクル1で実装する範囲
  reach: mandate
  status: settled
  settled_by: human
  answer: 案C(ほぼ全部)を選択。ただし承認前の縮小で R-9(音声回答と AI 採点)を落とし、取り込み自動化・グロッサリ・復習スケジューリング・複数デッキ・Web UI を含む11要件(R-9
    は欠番)とする。アナリストの推奨(案A)は採らない。
  requirement_ids:
  - R-1
  - R-2
  - R-5
  - R-10
  - R-11
  - R-12
- id: D-002
  subject: 効果測定のための問題の hold-out 分割
  reach: mandate
  status: settled
  settled_by: human
  answer: 分割しない。全問を教材に使い、効果の判定は主観に委ねる。結果として、未見問題への転移(中心仮説)は本サイクルでは支持も反証もできない。
  requirement_ids:
  - R-8
- id: D-003
  subject: サイクル1の acceptance をどこで切るか
  reach: mandate
  status: settled
  settled_by: human
  answer: 測定器の完成まで。実際の学習と実測は次サイクル。external evidence の待ちは発生させない。この帰結として、実 CI の green は NFR-5 の対象外になる(AR-6)。
  requirement_ids:
  - R-8
  - NFR-5
- id: D-004
  subject: 圧縮率・未分類比率・クラスタ割当一致率の合格ライン
  reach: local
  status: settled
  settled_by: loop
  answer: 実データの圧縮率には合格ラインを設けず、記録することだけを要件とする。ただし既知5グループの固定フィクスチャに対しては、最大クラスタ 50% 以下・「その他」20% 以下の下限を課す(AR-2
    の2巡目)。
  rationale: 実測前に閾値を置くと意味のない数値を後から緩めることになる。記録を要件とし、閾値は次サイクルで数値を見てから決める。退化ガードは閾値ではなく下限であり、これとは別に置いた。
  requirement_ids:
  - R-3
- id: D-005
  subject: 『想起キー』の定義
  reach: local
  status: settled
  settled_by: loop
  answer: 問題文に現れ、そのクラスタの正解を一意に指し示す語・状況・条件の組。『一意に指し示す』は、他クラスタ出現率の記録と同一キーの重複禁止で観測可能にする(AR-14)。
  rationale: 定義が変わると R-4 の生成ロジックと受入基準3本の作り直しで済み、claim の文面(想起素材が生成され、元データに実在する)は変わらない。
  requirement_ids:
  - R-4
- id: D-006
  subject: 台本が誤答選択肢の中身にどこまで触れてよいか
  reach: mandate
  status: settled
  settled_by: human
  answer: 中身には比較の形で触れてよいが、選択肢のラベル列挙はしない。ラベル列挙とは記号・番号・かなを問わず4件を並列提示する形を指し、その不在を non-goal『単なる読み上げ』の機械判定基準とする(AR-12)。
  requirement_ids:
  - R-6
- id: D-007
  subject: Udemy からの取り込み方式と、規約上の可否の前提
  reach: mandate
  status: settled
  settled_by: human
  answer: 拡張またはスクリプトで自動抽出する。規約上の可否は本人が確認済みで、個人利用の範囲で行うという前提を記録して進める。本ループはこの解釈を独立に検証していない。
  requirement_ids:
  - R-2
- id: D-008
  subject: LLM・TTS・音声認識の調達方法
  reach: local
  status: settled
  settled_by: loop
  answer: 差し替え可能なインタフェースの背後に置く。LLM はサブスクリプション認証の Claude Code CLI(claude -p)経由、TTS はローカル OSS(ADR-004)。2026-09-25
    に、従量課金の禁止(D-084)を受けて「クラウド API を利用し」から書き換えた。
  rationale: 差し替え可能なインタフェース越しに使う限り、提供元や呼び出し経路の変更は adapters 1箇所の差し替えで済み、claim も受入基準も動かない。実際、2026-09-25
    の経路変更で ports/llm.py の Protocol と TokenUsage の4値はどちらも変わっていない。
  requirement_ids:
  - R-3
  - R-4
  - R-6
  - R-7
  - R-9
- id: D-009
  subject: クラスタが排他分割か多重所属可か
  reach: local
  status: settled
  settled_by: loop
  answer: 排他分割とし、分類できない問題は『その他』クラスタへ入れて比率を記録する。多重所属は要求がないため作らない。
  rationale: 排他分割から多重所属へ広げるのはデータ構造と集計の変更で、R-3 の受入基準の文言のみが動く。1問が2つのパターンを問う場合の扱いは『その他』クラスタと要約で吸収できる。
  requirement_ids:
  - R-3
- id: D-010
  subject: 1クラスタあたりの台本長の上限と、超過時の扱い
  reach: local
  status: settled
  settled_by: loop
  answer: 推定再生時間3分を上限の初期値とし、実測後に見直す。超過したクラスタは打ち切らず分割または再生成し、列挙する。文字数での定義は言語によって再生時間が3倍変わるため採らない(AR-18)。
  rationale: 上限値の見直しは数値の書き換えのみ。超過時に打ち切らない方針は受入基準の追加であって、既存の基準を緩めない。
  requirement_ids:
  - R-6
- id: D-011
  subject: 音声学習の形式
  reach: local
  status: settled
  settled_by: loop
  answer: 一問一答形式(想起の問いかけ→間→答え→識別ポイント)を基本形式とする。
  rationale: 台本生成タスク1つの作り直しで済み、claim の文面は変わらない。複数形式を比較する設計にするとスコープが広がるが、それは次サイクルの判断。
  requirement_ids:
  - R-6
- id: D-012
  subject: 提供形態
  reach: mandate
  status: settled
  settled_by: human
  answer: Python CLI(生成パイプライン)+ Next.js/React のローカル Web UI(テスト出題と閲覧)。Chrome 拡張と携帯ネイティブアプリはスコープ外。
  requirement_ids:
  - R-12
- id: D-013
