      executor_profile: quality
  - id: A-11
    statement: fake による1回の呼び出しごとに、T-042 の InvocationRecord が1件、ログへ出る。合成の教材本文を含む stdout はマスクされ、stdin の本文(プロンプト)はログのどこにも現れない(sha256 と長さだけ)。stdout や stderr を InvocationRecord を経ずに書く経路は無い(C-014、C-015、AR-146)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_llm_claude_cli.py::test_each_invocation_emits_one_masked_record
      executor_profile: quality
  - id: A-12
    statement: runner の実行中に SystemExit の派生が送出されたら、ClaudeCliLlm はそれを失敗(SPAWN など)に変えず、そのまま再送出する。meter の failures_by_kind は増えない(AR-149)。
    evidence:
