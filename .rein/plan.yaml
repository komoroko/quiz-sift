    name: 最小ホームでの実 CLI 呼び出し(合成プロンプトのみ、2モデル × 3点)ぶんのレート枠
    paths:
    - tests/measurements/measure_overhead.py
    reversible: true
    adr: ADR-013
- id: T-031
  title: 計測の作り直し(RunMeter と notional コスト)
  kind: foundation
  blocked_by:
  - T-002
  claim_ids:
  - C-019
  domains:
  - infra
  - observability
  risk: medium
  scope:
    include:
    - src/quiz_sift/ports/metering.py
    - src/quiz_sift/ports/__init__.py
    - src/quiz_sift/pipeline/meter.py
    - src/quiz_sift/pipeline/overhead.py
    - tests/ports/test_metering.py
    - tests/pipeline/test_meter.py
  acceptance:
  - id: A-1
    statement: ports/metering.py に RunMeter(UsageRecorder を継承し begin_call / begin_invocation / end_invocation / record_quota / record_failure を持つ)と、7種の FailureKind が定義され、Meter が RunMeter を満たす。ports/metering.py は adapters を import しない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/ports/test_metering.py::test_run_meter_protocol_and_failure_kinds
      executor_profile: quality
  - id: A-2
    statement: Meter.finish が書く JSON Lines の1行に、設計 NFR-7 節のフィールド一覧の全キー(run_id から quota_at_end まで)が現れ、llm_calls・provider_invocations・model_turns・turns_by_model が begin_call / begin_invocation / end_invocation の回数と num_turns の総和に一致する。quota_at_start / quota_at_end は record_quota が最初と最後に受けた値である。キーを1つでも欠く行は赤。T-002 の A-2 / A-3 のテストノード(test_meter_records_run_fields / test_token_breakdown_and_price_provenance)は緑のまま残る(D-113)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/pipeline/test_meter.py::test_meter_line_carries_every_nfr7_field
      executor_profile: quality
  - id: A-3
    statement: 既知のトークンベクタと既知の単価表に対する estimated_cost.computed が手計算の期待値に一致し、declared(end_invocation に渡った cost_usd の総和)と relative_diff が記録される。単価が1つでも 0 なら status が unavailable / zero_price になり、単価表に無いモデル ID では例外を投げず unavailable / unknown_model になる。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/pipeline/test_meter.py::test_notional_cost_computed_declared_and_unavailable
      executor_profile: quality
  - id: A-4
    statement: 既定の単価表が claude-opus-5-5 と claude-haiku-4-5 の2モデルを持ち、4値の単価がすべて 0 より大きく、各モデルが priced_at と取得元 URL(空でない)を持つ。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/pipeline/test_meter.py::test_price_table_has_two_models_with_sources
      executor_profile: quality
  - id: A-5
    statement: usage が None で終わった呼び出しは invocations_without_usage に、turns が None の呼び出しは invocations_without_turns に数えられ、失敗した呼び出しの usage もトークン総量に加算される。failures_by_kind は7種すべてのキーを持つ。ended_by_rate_limit は D-110 の規則(実行を止めた失敗が PROVIDER_ERROR で、その呼び出しの最後の rate_limit_info の status が allowed_warning 以外)で真になり、真のとき resetsAt を併記する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/pipeline/test_meter.py::test_failed_and_usage_less_invocations_are_counted
      executor_profile: quality
  - id: A-6
    statement: overhead がモデル別の写像として出力され、記録された argv_digest が begin_invocation に渡された argv のダイジェストと違う、または定数が無いモデルは unknown と報告される。テストは定数表を注入して判定し、pipeline/overhead.py の既定の表に依存しない(T-030 が表を埋めても赤にならない)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/pipeline/test_meter.py::test_overhead_is_unknown_on_argv_mismatch_and_quota_is_recorded
      executor_profile: quality
  - id: A-7
    statement: 'estimated_cost に "notional": true が入り、同じ行に免責の1行が含まれ、キーにも値にも billed / charged / 実課金 の語が現れない。語を1つ差し込んだ出力に対して判定が赤になる。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/pipeline/test_meter.py::test_output_is_notional_and_never_claims_billing
      executor_profile: quality
  operator_surface:
  - kind: observability
    name: 実行ログ out/<deck>/meter.jsonl(notional コスト・3つの呼び出し回数・レート枠の使用率)。単価表の取得元 URL は人が読んで確かめる
    paths:
    - src/quiz_sift/pipeline/meter.py
    reversible: true
    adr: ADR-013
