    handoff:
      review:
        findings:
        - severity: must_fix
          statement: '再開で戻した『通過』の問題は、前の実行で後から埋まった前方の問題を相手に重複の検査を受け直さないため、クラスタをまたぐ重複キーが成果物に入る。再現: 1回目の実行で問題
            i の呼び出しが枠切れ以外の LlmCallError(stop_seen は偽のまま)で失敗し、ループは continue で進む。後ろの問題 j>i(i と別クラスタ)は i
            を含まない earlier で検査されて通過し、途中結果に passed として残る。末尾で RecallCallsFailed になる。--resume では i が生成され、earlier(<i)とだけ比べられて通過し、j
            は検査し直されずに戻される。i と j のキーの term_set が同じでも duplicate_key は出ず、report の duplicate_keys は 0 のまま
            emit され、成果物が書かれる。1回で走った場合は j が i と比べられて作り直されるので、C-028 の『全項目が検査を通ったときだけ書く』と generate.py 冒頭の『1回で走った場合と同じ』に反する。通過の状態を戻すときは
            check_question(呼び出しの無い決定的な検査)を現在の earlier でかけ直し、落ちたら途中の状態として扱う、などの直し方がある。この経路(前方の問題が呼び出し失敗、後方の問題が通過、再開で重複)を赤にするテストも無い。A-2
            のテストが扱うのは、戻した問題が前方にある場合だけである。'
          anchor: src/quiz_sift/recall/generate.py:314
      updated_at: '2026-10-13T19:16:28+09:00'
