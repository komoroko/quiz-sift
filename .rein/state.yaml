          - 記録を読むテストとして `test_claude_cli_hardening_logs.py` を新しく置き、既存のログ検査 3 本を新しい argv に合わせました。


          **検証**: A-1〜A-9 の pytest ノードはすべて緑です。lint、format、types、docs、smoke も緑です。


          **赤のまま残っている 2 件**: `tests/adapters/test_claude_failure.py` の次の 2 本です。

          - `test_overage_scan_covers_parse_and_timeout_output`

          - `test_event_streams_come_only_from_the_fake_factory`


