        subject_head_sha: f2956059863da8590776b2037796d8996b47eebb
    - id: SEC-002
      severity: low
      category: information_disclosure
      attack_scenario: '`docs/test/measurements/full-run.md` is committed. It copies the operator''s full
        host environment variable name list from meter.jsonl (for example `REIN_CAPABILITY_TOKEN`, `REIN_CONTROL_SOCKET`,
        `CLAUDE_CODE_MESSAGING_TOKEN`, `HERDR_SOCKET_PATH`), along with absolute host paths (`/mnt/d/prog_works/...`,
        `/home/koich/...`). No values are included. Anyone who can read the repository still learns which
        agent tooling runs on the host and where its capability tokens and control sockets live. That
