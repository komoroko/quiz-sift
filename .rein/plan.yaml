      - -q
      - tests/measurements/test_claude_cli_logs.py::test_fixtures_match_their_meta_and_the_design_argv
      executor_profile: quality
  - id: A-3
    statement: 2件の success フィクスチャの init イベントで、tools が {StructuredOutput} と一致し、apiKeySource が none、memory_paths が null である。これが docs/test/measurements/claude-cli-contract.md にフィクスチャごとに記録され、その値がフィクスチャ本体から読んだ値と一致する。
