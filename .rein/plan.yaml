  settled_by: loop
  answer: 実行を止めた失敗が PROVIDER_ERROR で、その呼び出しの最後の rate_limit_event の status が allowed_warning 以外(イベントはあるが既知の許可状態でない)のとき真とする。status と resetsAt は真偽に関わらず生のまま記録する。
  rationale: レート制限は特別扱いしない(D-091 撤回)ので、この値は処置を分けず、人が再実行の時期を読むための表示にしか使わない。誤判定しても挙動は変わらず、生の値が併記されるので人が読み直せる。枠切れ時の実際の形は未観測で、T-020 の最初の到達で分かる。
