        summary: 'T-064 の scope が、設計(docs/20-design.md R-6)の型変更が必ず触るテストを含まない。設計は Answer(texts: tuple[str,
          ...]) と、Discrimination に distractor_ids を足すことを求めるが、scope 外の tests/audio/conftest.py:46-47、tests/domain/test_shared_types.py:101,124-125、tests/glossary/test_audio_series.py:39
          が Answer("…") / Discrimination("…") を1引数の文字列で直接組み立てている。設計どおりに変えると、この3ファイルが mypy(gate.sh types)と
          pytest で赤になる。直すには scope 外への書き込みが要る。rein task scope-add は『guard.scope_additions が未設定』として拒否した。scope
          を広げずに通す手段は2つあるが、どちらも採らなかった。(a) Discrimination.distractor_ids に既定値 () を置く: 互換シムで、ID の無い識別ポイントを型として許してしまう。(b)
          台本の Discrimination に ID を持たせず、generate_scripts の中で RecallSet から引く: 設計の『Discrimination に distractor_ids
          を引き継ぐ』から外れる。依頼: /revise で T-064 の scope に上の3ファイルを足すこと。足せば受入基準 A-1〜A-3 はこのまま実装できる。何も変更していない。'
