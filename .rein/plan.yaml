      - tests/measurements/test_full_run_logs.py
  - id: A-2
    statement: キャッシュを迂回した再クラスタリングの記録が docs/test/measurements/reproducibility.md に残る。使うのは、--fresh-run cluster の1実行だけで exit 0 まで走った列2本で、再開した列は使わない(D-142)。2本のそれぞれで、classify_clusters の llm_calls が 1、provider_invocations が ⌈N/25⌉(N は問題数)であり、2本の合計がそれぞれ1回分のちょうど2倍である(D-155)。cluster 段の llm_calls の総数(要約と含意判定を含み、クラスタ数に依存する)は、2本それぞれの値がメソッド別の内訳とともに記録されている。割当一致率が数値として記録されている。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_full_run_logs.py::test_reproducibility_uses_two_single_execution_fresh_sequences
      executor_profile: quality
      produces:
      - docs/test/measurements/reproducibility.md
  - id: A-3
    statement: 生成した mp3 に対する無音構造判定の実行結果が docs/test/measurements/audio-silence.md に記録され、全クラスタについて真である(3.0 秒以上の無音が、前後を有音に挟まれて検出された)。1件でも偽なら赤。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_full_run_logs.py::test_audio_silence_is_true_for_every_cluster
      executor_profile: quality
      produces:
      - docs/test/measurements/audio-silence.md
  - id: A-4
    statement: 実データの M/N・最大クラスタ比率・「その他」比率が full-run.md に数値として記録され、人が圧縮の質を判定できる。3値のいずれかが欠ければ赤(値そのものに合格ラインは設けない。D-004)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_full_run_logs.py::test_compression_metrics_are_present
      executor_profile: quality
  - id: A-5
    statement: 列のすべての実行の metered_env_names が空で、実行時の環境変数名の一覧(値は伏せる)が記録されている。記録された env_names と、要件から写した13変数(テスト側のリテラル)の積集合が、どの実行でも空である(AR-137)。その状態で列が completed になり、overage_invocations が 0、最後の実行の failures_by_kind がすべて 0 であることを機械判定する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_full_run_logs.py::test_sequence_completed_without_metered_credentials_or_overage
      executor_profile: quality
  - id: A-6
    statement: 列の overage_check が passed か unknown のどちらかである。unknown の場合は、invocations_without_rate_limit_event の件数が full-run.md に書かれている。各実行の quota_at_start / quota_at_end が、値として、または null と欠落件数として記録されている(NFR-8 (f)(h))。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_full_run_logs.py::test_overage_check_and_quota_are_recorded
      executor_profile: quality
  operator_surface:
  - kind: security_boundary
    name: 教材本文が、ホストの Claude Code セッション記録(最小ホーム配下の .claude/projects/**/*.jsonl)に平文で書かれる。リポジトリの外にあり、消しても取り消せない(D-086 が許容)
    paths:
    - src/quiz_sift/adapters/llm_claude_cli.py
    - src/quiz_sift/adapters/claude_process.py
    reversible: false
    adr: ADR-014
  - kind: dependency
    name: サブスクリプションのレート枠の消費(フル処理の列と、再現性測定の2列ぶん)。枠で止まったら、人が --resume で再開する。課金は発生しない(NFR-8)
    paths:
    - src/quiz_sift/pipeline/meter.py
    - src/quiz_sift/pipeline/run_sequence.py
    reversible: false
    adr: ADR-018
  requires:
  - says: ホストの PATH に claude(Claude Code CLI)がある
    probe:
    - which
    - claude
  - says: 最小ホーム ~/.quiz-sift-claude-home が用意され、資格情報ファイルがある(HOME=~/.quiz-sift-claude-home claude /login を1回。ファイルは開かずに存在だけを見る)
    probe:
    - python3
    - -c
    - import os,sys; sys.exit(0 if os.path.lexists(os.path.expanduser('~/.quiz-sift-claude-home/.claude/.credentials.json')) else 1)
  - says: CosyVoice の本体がこのホストの Python から import できる(uv sync --extra tts と、CosyVoice のチェックアウトを PYTHONPATH に通すこと。重みの場所は --tts-model で渡す)
    probe:
    - .venv/bin/python
    - -c
    - import importlib; importlib.import_module('torch'); importlib.import_module('cosyvoice.cli.cosyvoice')
- id: T-048
  title: cli.main の外へ抜けた例外のトレースバックで認証情報を伏せる
  kind: foundation
  blocked_by:
  - T-040
  claim_ids:
  - C-015
  domains:
  - security
  risk: high
  scope:
    include:
    - src/quiz_sift/cli.py
    - tests/test_cli.py
  acceptance:
  - id: A-1
    statement: '不具合の再現: 合成の API キー(sk-ant-…)・password=・Cookie の dj_session_id / ud_user_jwt の値をメッセージに載せた ConnectionError を llm が送出するとき、cli.main はその例外をそのまま外へ送出する(型が ConnectionError のまま)。main が返ったあとで sys.stderr を新しいバッファに差し替えてから、その例外情報で sys.excepthook を呼ぶ。このとき、新しいバッファに例外の型名と認証情報でないメッセージ部分が出て、4つの合成値のどれも平文で現れない(出力先は呼ばれた時点の sys.stderr)。修正前のコードではこのテストが赤になる。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_uncaught_exception_traceback_masks_credentials
      executor_profile: quality
  - id: A-2
    statement: 認証情報を載せない例外(raise X from Y で、認証情報は原因 Y の側だけに載る形を含む)について、sys.excepthook の出力は次のとおりになる。認証情報を載せない例外では、traceback.format_exception で整形したテキストを連結したものと一致する(伏せる以外に書き換えない)。原因の側に載った認証情報は伏せられ、"The above exception was the direct cause" の連鎖表示は残る。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_excepthook_masks_the_cause_chain_and_changes_nothing_else
      executor_profile: quality
  - id: A-3
    statement: cli.main を2回呼んだあと、sys.excepthook は cli.py の伏せるフック(モジュール関数)と同一である。sys.excepthook を別の関数に差し替えてから main を呼ぶと、再び伏せるフックに戻る。伏せるフックは、main の前に入っていたフックを呼ばない(記録用のフックを置いて、呼ばれないことで確かめる)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_excepthook_is_installed_by_identity_and_does_not_delegate
      executor_profile: quality
  - id: A-4
    statement: 伏せるフックの中で失敗が起きても平文へ戻らない。mask_secrets が例外を出すように差し替えたうえで、認証情報を載せた例外情報でフックを呼ぶ。このとき、フックは例外を外へ出さず、sys.stderr には例外の型名が出て、合成値は平文で現れない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_excepthook_failure_does_not_fall_back_to_plaintext
      executor_profile: quality
  operator_surface: []
  requires: []
- id: T-049
  title: 要約の実在判定を専門用語の断片に絞り、要約プロンプトで長さと形を縛る
  kind: foundation
  blocked_by:
  - T-040
  - T-033
  claim_ids:
  - C-003
  domains:
  - analysis
  risk: high
  scope:
    include:
    - src/quiz_sift/cluster/summary.py
    - src/quiz_sift/adapters/llm_prompts.py
    - tests/cluster/test_summary.py
  acceptance:
  - id: A-1
    statement: '不具合の再現(日本語デッキ): 次の要約について ungrounded_terms は空を返し、cluster_deck はそのクラスタを書き出す。要約は2種類の語を含む。1つは、クラスタの問題本文に現れない漢字だけの一般名詞(合成の例「判断」「要点」)。もう1つは、漢字とカタカナが混ざった合成の名詞句で、句全体は本文に無いがカタカナの列は本文にあるもの(本文に「ポイント」があり「確認ポイント」は無い、の形)。修正前のコードではこのテストが赤になる。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/cluster/test_summary.py::test_generic_nouns_absent_from_the_cluster_do_not_stop_the_summary
      executor_profile: quality
  - id: A-2
    statement: 捏造された専門用語は引き続き止まる。日本語デッキでは、本文に無いカタカナの列(合成)、本文に無い英字の語(Lambda)。英語デッキでは、文の途中にある本文に無い大文字始まりの語(Lambda)と、本文に無い大文字略語。それぞれの要約で UngroundedSummary が上がり、何も書き出されず、含意判定は呼ばれない。例外のメッセージに語句そのものは載らない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/cluster/test_summary.py::test_invented_technical_terms_still_stop_the_summary
      executor_profile: quality
  - id: A-3
    statement: 英語デッキで、本文に無い小文字の一般語と、文頭にある本文に無い大文字始まりの一般語だけを含む要約は、ungrounded_terms が空を返す。専門用語が0件の日本語の要約(漢字だけの語)も空を返し、含意判定にはかかる。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/cluster/test_summary.py::test_general_words_are_not_checked_and_term_free_summaries_still_go_through_entailment
      executor_profile: quality
  - id: A-4
    statement: 旧サイクルで凍結したテストが緑のままである。tests/cluster/test_summary.py の凍結ノード(下の command に列挙)は、関数名も本体の assert も変えない(新しいテストは別の関数として足す)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/cluster/test_summary.py::test_summary_terms_must_exist_in_the_cluster
      - tests/cluster/test_summary.py::test_summary_goes_through_entailment
      - tests/acceptance/test_analysis.py::test_c003_clusters_are_exclusive_and_summaries_grounded
      executor_profile: quality
  - id: A-5
    statement: SUMMARIZE_SYSTEM が次の3点を指示する。見出し・箇条書き・記号の装飾を使わない平文で3文以内・200字以内に書くこと。専門用語は問題文の表記のまま使うこと。問題文に無い専門用語や見出し語を作らないこと。SUMMARIZE_SCHEMA は変えない(D-160)。
  operator_surface: []
  requires: []
