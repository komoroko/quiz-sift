        statement: _tool_problem fails when there is no system/init event or when any init.tools list
          is not exactly {'StructuredOutput'}. It also fails when any assistant content block has a type
          ending in 'tool_use' and a name outside {'StructuredOutput'}. Only assistant events are inspected
