  - id: A-2
    statement: 表から最小二乗で求めた切片 c を num_turns で割った値が、pipeline/overhead.py のモデル別 per_turn_tokens と一致する。定数は measured_at・cli_version・計上先のバケツ・argv_digest・skills_digest を持つ。argv_digest は現在の ClaudeCliLlm の argv のダイジェストと一致し、skills_digest は表に記録した値と一致する。
