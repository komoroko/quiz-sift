      executor_profile: quality
  - id: A-3
    statement: '3点の残差が線形性を反証しないことを判定する。許容幅は計画で凍結する: 各点の回帰予測との相対誤差が 1% 以内(実装者は変えられない。AR-145)。Σ_model(overhead_model × turns_model) + material が、各点の報告された入力トークン合計と、同じ相対誤差 1% 以内で一致することも判定する。material は合成ブロックの既知長 × k から出す。material を合計からの差し引きで出した表に対しては、判定が赤になる。'
