  - id: DC-020
    question: 'SEC-001 (sandbox_escape, severity medium): Question text scraped from a third-party quiz
      site goes into the `claude -p` child on stdin, so it can carry a prompt injection. The child''s
      tool restriction is a denylist: `DENIED_TOOLS` is a hard-coded list passed through `--settings permissions.deny`.
      There is no allowlist such as `--tools StructuredOutput`. If a Claude Code update adds a tool that
      is not on the list, for example a new network, fetch or file tool, that tool is enabled. Injected
      material can then make the model call it from a process whose HOME is the minimal home holding `.claude/.credentials.json`
      (the OAuth token), and use it to read or exfiltrate that token or run other side effects. `claude_failure._tool_problem`
      catches the extra tool only after the child has exited, and only marks the call PROVIDER_ERROR.
      By then the side effect has already happened. The code''s own docstring says the list''s completeness
      is not guaranteed. What is done about it?'
