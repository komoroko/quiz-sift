    - tests/test_cli.py
    - tests/ports/test_protocols.py
    - tests/safety/test_entailment.py
    - tests/support/
    - tests/acceptance/conftest.py
  acceptance:
  - id: A-1
    statement: 新規インタプリタで判定する。親環境に 13 個の metered 認証変数を入れ、sys.path にスタブの anthropic パッケージを置いた状態で、既定構成のクラスタリング段(cli.main(['cluster', <合成デッキ>]))を1回走らせる。その後、sys.modules に anthropic が無い。positive control として、同じ実行で build_default_llm() が呼ばれ、llm_calls ≥ 1 である。anthropic が import できなければ、skip せず失敗する。claude は PATH に置いた fake 実行ファイル、最小ホームはテストが作った tmp の HOME で満たす。その tmp の最小ホームは T-039 A-4 の実測形(資格情報ファイルを含む)を持つ。後で T-045 が既定の preflight を結線しても、このテストが同じ形のまま緑であるため(AR-140)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/nfr8/test_no_metered_sdk.py::test_default_run_never_loads_the_sdk
      executor_profile: quality
      produces:
      - src/quiz_sift/composition.py
      - tests/nfr8/
  - id: A-2
    statement: 選択点を SDK アダプタへ差し替えた版では、同じ判定が赤になる。その差し替え版でも llm_calls ≥ 1 は緑である(negative control。import だけで赤になったのではないことを示す)。AnthropicLlm のコンストラクタは (meter) の1引数で、クライアントは本体で構築する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/nfr8/test_no_metered_sdk.py::test_swapping_in_the_sdk_adapter_goes_red
      executor_profile: quality
  - id: A-3
    statement: composition.build_default_llm の本体は return 文1つで、右辺は inspect.isclass で確かめたクラス名の直接呼び出しである。If / Match / Try / Subscript / IfExp / BoolOp / Lambda / Attribute / comprehension / Import を含まない。src/ 全体で、Llm を実装するクラスを構築する式は composition.py の1箇所だけである。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/nfr8/test_composition.py::test_single_static_selection_point
      executor_profile: quality
  - id: A-4
    statement: pyproject.toml のコンソールスクリプトはちょうど1つである。それと、__main__ ガードを持つモジュール(python -m の入口)のすべてから到達可能な import グラフに、anthropic など metered API へ HTTP を発行しうるモジュールが 0 件である。cli.py は llm_anthropic を import しない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/nfr8/test_entry_points.py::test_no_entry_point_reaches_a_metered_client
      executor_profile: quality
  - id: A-5
    statement: LlmFactory は Callable[[RunMeter], Llm] になる。外部 LLM 呼び出しに失敗があった実行は、下流へ進まず非 0 で終わり、サマリに未分類比率・最大クラスタ比率・失敗件数が出て、失敗件数は実際の失敗数と一致する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_llm_stages_stop_on_failure_and_summarise
      executor_profile: quality
  - id: A-6
    statement: 各段の inputs_digest に、その段で使うメソッドのモデル ID(ADR-015 の割り当て)が入る。ある段のモデルだけを変えると、その段の digest が変わってキャッシュが無効化される。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_stage_digest_carries_the_models_it_uses
      executor_profile: quality
  - id: A-7
    statement: 途中の段から再実行したとき、それより前の段の llm_calls と provider_invocations がどちらも 0 である(fake runner の起動回数で数える)。absorb タスク(T-032〜T-036)の受入テストが緑のまま残る。このタスクが tests/acceptance/ で触れてよいのは conftest.py の実行ヘルパだけで、受入テスト本体は scope の外にある(AR-141)。scope の中にある旧凍結ノード(tests/test_cli.py・tests/safety/test_entailment.py・tests/ports/test_protocols.py)は、呼び出し口の差し替えだけを変え、assert は変えない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli.py::test_resume_makes_no_llm_calls_or_invocations_upstream
      - tests/acceptance/
      executor_profile: quality
  operator_surface:
  - kind: public_interface
    name: コンソールスクリプト quiz-sift(1本だけ)と、既定 LLM の唯一の選択点 composition.build_default_llm
    paths:
    - pyproject.toml
    - src/quiz_sift/composition.py
    reversible: true
    adr: ADR-013
  - kind: dependency
    name: anthropic は、このサイクルでは通常依存のまま残る(D-103)。製品の実行経路からは到達しない
    paths:
    - pyproject.toml
    reversible: true
    adr: ADR-013
- id: T-045
  title: 実行の列の CLI(--fresh-run / --resume、起動前検査の結線、開始行と終了行、12 時間の上限、段の早期停止)
  kind: integration
  blocked_by:
  - T-038
  - T-039
  - T-044
  claim_ids:
  - C-019
  - C-003
  - C-016
  - C-020
  domains:
  - pipeline
  - observability
  risk: critical
  scope:
    include:
    - src/quiz_sift/cli.py
    - src/quiz_sift/pipeline/stage.py
    - src/quiz_sift/pipeline/meter.py
    - src/quiz_sift/ports/metering.py
    - tests/test_cli.py
    - tests/test_cli_sequence.py
    - tests/pipeline/test_stage.py
    - tests/nfr8/test_entry_points.py
    - tests/support/
    - tests/acceptance/conftest.py
  acceptance:
  - id: A-1
    statement: '--fresh-run を付けた LLM 段は、新しい run_id を採番して stderr に表示する。開始行(cache_mode: fresh)は、最初の spawn より前に fsync まで済んでいる。fake runner が spawn の時点でファイルを読んで確かめる。同じ入力の通常の実行が作った成果物があっても、段キャッシュにヒットせず spawn する。fresh / resume の実行の inputs_digest には run_id が入る。通常の実行(cache_mode: normal)の digest は変わらない(既存の tests/pipeline/test_stage.py のノードが緑のまま)(D-136、D-137)。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_fresh_run_registers_and_bypasses_the_cache
      - tests/pipeline/test_stage.py
      executor_profile: quality
      produces:
      - tests/test_cli_sequence.py
  - id: A-2
    statement: --resume RUN_ID が許されるのは、列の status が resumable のときだけである。存在しない run_id・completed・not_completable の列では、即座に非 0 終了し、開始行を書かず、spawn も 0 回になる。resumable の列で再開すると、その列が作った段はキャッシュから読まれ(spawn 0 回)、ほかの列や通常の実行が作った成果物にはヒットしない(D-145)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_resume_is_allowed_only_for_a_resumable_sequence
      executor_profile: quality
  - id: A-3
    statement: LLM 段(cluster / recall / glossary / script / audio)は、開始行を書く前に preflight を呼ぶ。preflight が落ちると、非 0 終了し、meter.jsonl に1行も足さず、spawn も 0 回になる(D-132)。ingest / review / serve は preflight を呼ばない(D-143)。inspect.signature(cli.main) の llm_factory と preflight の既定値は、composition.build_default_llm と claude_process.default_preflight そのものである。入口のすべてが main を argv だけで呼ぶことを、AST で判定する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_preflight_runs_before_registration_on_llm_stages_only
      - tests/nfr8/test_entry_points.py::test_entry_points_call_main_with_argv_only
      executor_profile: quality
  - id: A-4
    statement: '1回の実行の上限は signal.alarm で掛かる。上限定数を1秒に差し替え、rate_limit_event を1件出したあと止まらない fake を与えると、非 0 終了になり、子プロセスは kill され、終了行が書かれる(stop.kind: other、exit_reason は SystemExit の派生クラス名)。その終了行の quota_at_end に、そのイベントの resetsAt が残る(C-003、D-138、AR-150)。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_the_execution_limit_stops_with_an_end_line
      executor_profile: quality
  - id: A-5
    statement: 終了行は finally で書かれる。exit 0、失敗による非 0、上限による停止のいずれでも、開始行と終了行が1組ずつ残る。キャッシュだけで終わる実行(spawn 0 回)も2行を書く(Meter は開始行の時点で作る)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_every_execution_writes_both_lines
      executor_profile: quality
  - id: A-6
    statement: '段をまたぐ早期停止(D-144)。3クラスタの recall 段で、1つ目の呼び出しの子に isUsingOverage 真が現れたら、残り2つは spawn されない(spawn 回数 1)。実行は非 0 終了し、サマリの失敗件数は 1 になる。1つ目が status: rejected かつ is_error 真で失敗した場合も同じ。1つ目が SCHEMA で失敗した場合は、3つとも spawn される。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_overage_or_rejected_stops_the_rest_of_the_stage
      executor_profile: quality
  - id: A-7
    statement: 'fake による端から端までの列を2通り走らせる。1つ目: fresh の cluster(exit 0)→ recall が rejected で停止 → resume で audio まで exit 0。最後の終了行の sequence.status は completed で、合算の llm_calls は各実行の和である。2つ目: 同じ流れで recall に overage を出す。列は not_completable になり、その後の --resume は拒否される。TTS は StubTts を使う。absorb タスクの受入テストは緑のまま残る。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_a_sequence_completes_across_a_rate_limit_stop_and_overage_does_not
      - tests/acceptance/
      executor_profile: quality
  - id: A-8
    statement: 開始行の env_names の集合は、テストが与えた親環境の変数名の集合とちょうど一致し、値を含まない(AR-158)。metered_env_names は、その一覧と NFR-8 が列挙した13変数(テスト側に要件から写したリテラル)の積集合である。13変数を1つずつ親環境に入れて走らせると、それぞれの metered_env_names がその1変数だけになり、列の status は not_completable になる。何も入れなければ空になる(C-020、AR-137)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_metered_env_names_come_from_the_parent_environment
      executor_profile: quality
  operator_surface:
  - kind: public_interface
    name: LLM 段のオプション --fresh-run と --resume RUN_ID(run_id は stderr に出る)。枠のリセット後に人が --resume で再開する
    paths:
    - src/quiz_sift/cli.py
    reversible: true
    adr: ADR-018
  - kind: persistence
    name: out/<deck>/meter.jsonl(gitignored、追記のみ、1実行につき2行)と、列ごとの段成果物(run_id 入りの digest。人が out/<deck>/ を整理するまで残る)
    paths:
    - src/quiz_sift/cli.py
    - src/quiz_sift/pipeline/stage.py
    reversible: true
    adr: ADR-018
- id: T-046
  title: 【ホスト】オーバーヘッド定数の実測(--safe-mode 付き argv・skills ダイジェスト)
  kind: integration
