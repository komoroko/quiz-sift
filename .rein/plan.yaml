  - id: A-10
    statement: 'classify_clusters の中の早期停止(D-144)。60 問(3バッチ)の分類で、1バッチ目の子に isUsingOverage 真が現れたら、残り2バッチは spawn されない(spawn 回数 1)。1バッチ目が status: rejected かつ is_error 真で失敗した場合も同じ。失敗件数は、実際に発行した呼び出しについてだけ数える。1バッチ目が SCHEMA で失敗した場合は、3バッチとも spawn される。'
    evidence:
