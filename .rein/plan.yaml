  settled_by: human
  answer: DEF-1、フル処理の完走、SEC-001〜SEC-004、N-of-M の複数選択問題を1サイクルで行い、製品のバージョンを 0.1.1 に上げる。分割は推奨したが採らない。
  requirement_ids:
  - R-1
  - R-2
  - R-3
  - R-4
  - R-6
  - R-7
  - R-8
  - R-12
  - NFR-1
  - NFR-2
  - NFR-5
  - NFR-7
  - NFR-8
- id: D-169
  subject: 製品のバージョン
  reach: mandate
  status: settled
  settled_by: human
  answer: 0.1.1。N-of-M が入力形式と学習記録ストアを壊す変更だと示したうえで、0.1.1 のまま。
  requirement_ids:
  - NFR-5
- id: D-170
  subject: 想起キーの実在の照合先
  reach: mandate
  status: settled
  settled_by: human
  answer: その問題の問題文だけ。選択肢と解説は含めない。
  requirement_ids:
  - R-4
- id: D-171
  subject: 想起素材の検査に落ちた問題の扱い
  reach: mandate
  status: settled
  settled_by: human
  answer: 落ちた問題だけを上限回数まで再生成し、回数を記録する。上限を超えたら成果物を出さずに止まる。
  requirement_ids:
  - R-4
- id: D-172
  subject: 子の CLI の出力本文のログ出力(SEC-003)
  reach: mandate
  status: settled
  settled_by: human
  answer: 本文をログに出さない。D-097(言い換えテキストのログへの残存を許容)を覆す。
  requirement_ids:
  - NFR-2
- id: D-173
  subject: N-of-M の採点
  reach: mandate
  status: settled
  settled_by: human
  answer: 正解の集合と完全に一致したときだけ正答。部分点は付けない。
  requirement_ids:
  - R-8
- id: D-174
  subject: 取り込む (N, M) の範囲
  reach: mandate
  status: settled
  settled_by: human
  answer: M ∈ {4, 5, 6}、1 ≤ N < M。範囲外は件数付きで除外する。
  requirement_ids:
  - R-1
- id: D-175
  subject: 既存の学習記録ストア
  reach: mandate
  status: settled
  settled_by: human
  answer: 残す記録は無い。新しい形で作り直し、移行は作らない。
  requirement_ids:
  - R-8
- id: D-176
  subject: N-of-M の答えが正解 N 件をすべて含むことの判定
  reach: mandate
  status: settled
  settled_by: human
  answer: 答えを N 要素の配列にし、要素ごとに含意判定する。
  requirement_ids:
  - R-4
  - NFR-1
- id: D-177
  subject: 識別ポイントの誤答選択肢の参照
  reach: mandate
  status: settled
  settled_by: human
  answer: 構造化した選択肢 ID の列で示し、ID で検査する。本文の括弧は検査しない。
  requirement_ids:
  - R-4
- id: D-178
  subject: SEC-001 の処置
  reach: mandate
  status: settled
  settled_by: human
  answer: 子の CLI にユーザ設定を読ませない指定を渡す。手段が無ければ /revise で人に戻す。
  requirement_ids:
  - NFR-8
- id: D-179
  subject: SEC-002 の処置
  reach: mandate
  status: settled
  settled_by: human
  answer: 許可リストで指定する。手段が無いことを実測した場合は拒否リストのまま受容し、記録する。
  requirement_ids:
  - NFR-8
- id: D-180
  subject: R-2 と実デッキの取り直し
  reach: mandate
  status: settled
  settled_by: human
  answer: このサイクルで行う。まず前サイクルで保存した生 HTML をオフラインで再抽出し、期待件数(190 問、5択2正解13・6択3正解2)に届かないときだけ人が Udemy から取り直す(試行1回)。ゴールデンセットに
    N-of-M を3件以上足す。(2026-10-06 の追加の回答で改めた)
  requirement_ids:
  - R-2
  - NFR-7
- id: D-181
  subject: フル処理の試行予算と再現性の列
  reach: mandate
  status: settled
  settled_by: human
  answer: 最大 3 回。--fresh-run で始めた列1本を1回と数え、同じ列の --resume は数えない。再現性の2列(cluster 段だけ)は予算の外で取る。(2026-10-06
    の追加の回答で定義を足した)
  requirement_ids:
  - NFR-7
- id: D-182
  subject: argv が変わったときの overhead の較正
  reach: mandate
  status: settled
  settled_by: human
  answer: このサイクルで取り直す。フル処理の前に置く。
  requirement_ids:
  - NFR-7
- id: D-183
  subject: フル処理の前のリハーサル
  reach: mandate
  status: settled
  settled_by: human
  answer: 合成デッキを実 CLI で recall 段まで通すもの1本と、合成した1文を実 CosyVoice(torch 2.10)で合成するプローブ1本。実データの小さな列は置かない。(2026-10-06
    の追加の回答で TTS プローブを足し、当初の「CosyVoice のリハーサルは置かない」を覆した)
  requirement_ids:
  - R-4
  - R-7
  - NFR-7
- id: D-184
  subject: 想起素材の生成単位
  reach: mandate
  status: settled
  settled_by: human
  answer: 要件を実装に合わせ「各問題について生成し、クラスタごとに束ねる」に直す。
  requirement_ids:
  - R-4
- id: D-185
  subject: 再生成の上限回数
  reach: local
  status: settled
  settled_by: loop
  answer: 2 回。
  rationale: 定数1つで、変えても recall のタスク1つで済み、claim は「上限を超えたら止まる」の形を変えない。合成デッキのリハーサルで不適合率を見て調整できる。
  requirement_ids:
  - R-4
- id: D-186
  subject: タイムアウト後の猶予(SEC-004)
  reach: local
  status: settled
  settled_by: loop
  answer: 5 秒。プロセスグループ単位で SIGKILL し、5 秒で pipe が閉じなければ自分で pipe を閉じて TIMEOUT を返す。
  rationale: 定数1つで、変えても子プロセスの起動点のタスク1つで済む。当初の 10 秒では C-021 の「タイムアウトから 10 秒以内に戻る」と両立しない(architect の指摘)ので
    5 秒に改めた。
  requirement_ids:
  - R-3
- id: D-187
  subject: 変える要件の claim の番号
  reach: local
  status: settled
  settled_by: loop
  answer: 前サイクルの claim を引き継ぐ要件は同じ番号(C-001 など)で文を差分に書き換え、新しい観点は C-021 から採番する。
  rationale: ID だけの問題で、tests/acceptance の test_cNNN_* の名前と揃う。主張の中身は動かない。
  requirement_ids:
  - R-1
- id: D-188
  subject: 取り込みの除外理由の名前
  reach: local
  status: settled
  settled_by: loop
  answer: OPTION_COUNT_NOT_4 を OPTION_COUNT_UNSUPPORTED に改名し、呼び出し側をすべて直す。
  rationale: enum の名前1つの変更で、主張は「列挙される」から変わらず、取り込みのタスク1つで閉じる。
  requirement_ids:
  - R-1
- id: D-189
  subject: N-of-M で受験者の選択から正解を推定する経路
  reach: mandate
  status: settled
  settled_by: human
  answer: ページの印(選択アイコンが単一選択か複数選択か)で単一選択と判別できた問題でだけ使う。複数選択と判別した問題と、判別できない問題で正解マークが無いものは抽出の失敗にする。印は保存済みの生
    HTML で確かめて決める。(当初 loop が local として「N-of-M では使わない」と決めたが、マークが無いと N-of-M かどうか分からないという指摘 AR-R5 を受けて人が決めた)
  requirement_ids:
  - R-2
- id: D-190
  subject: フル処理(不可逆)の実行者と実行場所
  reach: mandate
  status: settled
  settled_by: human
  answer: 人がホストで実行の道具(exec)を走らせ、週次枠で止まれば同じ列を --resume で続ける。ループは記録の整形(render)と判定だけを行う。operate は使わない。
  requirement_ids:
  - NFR-7
  - R-7
- id: D-191
  subject: 想起素材の再生成の対象
  reach: mandate
  status: settled
  settled_by: human
  answer: 1問単位の検査(実在しないキー、汎用語キー、丸写し、選択肢 ID の不整合、答えの要素の不整合、空の要素)とクラスタをまたぐ重複キー(後に来た問題を作り直す)に限る。含意判定の不合格は再生成せずに止め、LLM
    呼び出しの失敗も再生成しない。
  requirement_ids:
  - R-4
  - NFR-1
- id: D-192
  subject: 識別ポイントの ID と本文の対応をどう守るか
  reach: mandate
  status: settled
  settled_by: human
  answer: 識別ポイントの含意判定の reference に、参照先の誤答選択肢の本文を加える。矛盾すれば成果物を出さずにエラー終了する。
  requirement_ids:
  - R-4
  - NFR-1
- id: D-193
  subject: SEC-001 の実測で番兵が読まれたことを何で観測するか
  reach: mandate
  status: settled
  settled_by: human
  answer: 読まれると呼び出しが失敗する env(到達できない ANTHROPIC_BASE_URL など)を番兵にし、中身検査を通さない直接起動・製品と同じ argv で、指定なしで失敗(陰性対照)、指定ありで成功することを確かめる。
  requirement_ids:
  - NFR-8
- id: D-194
  subject: 空の許可リストを SEC-002 の許可リストに数えるか
  reach: mandate
  status: settled
  settled_by: human
  answer: 数える。拒否リストを外した状態で init.tools が {StructuredOutput} と一致すること。
  requirement_ids:
  - NFR-8
- id: D-195
  subject: NFR-1 の N-of-M の reference をグロッサリにも当てるか
  reach: mandate
  status: settled
  settled_by: human
  answer: 当てない。想起素材・台本・クラスタ要約に限る。グロッサリは前サイクルのまま。
  requirement_ids:
  - NFR-1
- id: D-196
  subject: NFR-5 の「0.1.0 が残らない」の uv.lock の範囲
  reach: mandate
  status: settled
  settled_by: human
  answer: quiz-sift の項目だけ。
  requirement_ids:
  - NFR-5
- id: D-197
  subject: SEC-003 の後、診断用に子の出力本文を残すか
  reach: mandate
  status: settled
  settled_by: human
  answer: 残さない。診断が要るときは合成の入力での再現を試み、実教材を手で CLI に流さない(D-214)。
  requirement_ids:
  - NFR-2
- id: D-198
  subject: G-1 の照合先の表で、クラスタ要約と他クラスタ出現率の照合先
  reach: local
  status: settled
  settled_by: loop
  answer: どちらも現行のまま、問題の本文(問題文・選択肢・解説)。変えるのは想起キーの照合先だけ。「揃える」は述語を1つにすることを指す。
  rationale: /req の草稿が要約と出現率を「問題文」と書いたのは、D-161 と現行コードを読み違えた誤記(AR-R1)。現行の挙動に戻すだけで、どの claim も照合先のこの2行を主張しない。
  requirement_ids:
  - R-3
  - R-4
- id: D-199
  subject: 「N-of-M」が指す範囲
  reach: local
  status: settled
  settled_by: loop
  answer: 正解が2件以上の問題(G-2)。N = 1 の問題は選択肢が5件・6件でも単一選択の UI と前サイクルの扱いのまま。入力と生成物の形(ID の配列、N 要素の答え)だけは全問で同じ。
  rationale: 人の回答はすべて複数正解の問題を指していた。実データに N = 1 で M ≥ 5 の問題は無い(前サイクルの抽出記録)。読み替えても UI のタスク1つで済む。
  requirement_ids:
  - R-1
  - R-2
  - R-6
  - R-12
  - NFR-1
- id: D-200
  subject: 重複キーを数える範囲
  reach: local
  status: settled
  settled_by: loop
  answer: 異なるクラスタの素材の間だけで数える(要件の文面どおり)。
  rationale: 現行の recall/verify.duplicate_count が同じクラスタ内も数えていて要件より強い(AR-R8)。関数1つの変更で、要件の文面は前サイクルから変わらない。
  requirement_ids:
  - R-4
- id: D-201
  subject: ラベル列挙の判定を M 件に広げる形
  reach: local
  status: settled
  settled_by: loop
  answer: 同じ系列の先頭から M 件のラベルがすべて揃う形(現行 label_guard の判定を4件固定から M 件に広げる)。
  rationale: 「4件以上」と書いた草稿は、答えが N 件の正解に触れる正当な台本を落とす(AR-R17)。判定関数1つで変えられる。
  requirement_ids:
  - R-6
- id: D-202
  subject: 全問誤答の入力の作り方
  reach: local
  status: settled
  settled_by: loop
  answer: 正解の集合のうち1件を誤答選択肢1件に入れ替えた N 件の集合。
  rationale: N > M−N の組では誤答選択肢だけから N 件を選べない(AR-R3)。フィクスチャの作り方だけで、採点の主張は動かない。
  requirement_ids:
  - R-8
- id: D-203
  subject: 学習記録ストアの所在
  reach: local
  status: settled
  settled_by: loop
  answer: 変えない。同じ所在で旧形式を検出してエラーで止まる。
  rationale: 所在を変えると旧形式の検出が発火せず基準が形骸化する(AR-R22)。定数1つ。
  requirement_ids:
  - R-8
- id: D-204
  subject: 旧形式のストアを見つけたときの処置
  reach: local
  status: settled
  settled_by: loop
  answer: 製品は消さず、エラーで止まって所在と版を伝え、人に別名への退避を案内する。
  rationale: 削除は不可逆なので製品にさせない。退避は人の操作で可逆。エラーメッセージ1つの問題。
  requirement_ids:
  - R-8
- id: D-205
  subject: 入力形式の正解のキー名
  reach: local
  status: settled
  settled_by: loop
  answer: answer を answers に改名する。旧ファイルは未知のキーとして取り込み全体を止める。
  rationale: 型だけを変える案と比べて失敗の理由が明確になるだけで、どちらも C-001 を満たす。取り込みのタスク1つで戻せる。
  requirement_ids:
  - R-1
- id: D-206
  subject: 想起素材の生成に渡す選択肢のキー
  reach: local
  status: settled
  settled_by: loop
  answer: A〜F ではない不透明な値で渡し、parse 側で OptionId に写し戻す。
  rationale: R-6 のラベル判定に掛かる語を生成させないため。recall の契約の中で閉じ、claim は ID で参照することだけを言う。
  requirement_ids:
  - R-4
  - R-6
- id: D-207
  subject: 識別ポイントの数
  reach: local
  status: settled
  settled_by: loop
  answer: 1問に1件、distractor_ids は1件以上。
  rationale: 台本のセグメントの形を変えずに済む。要件は「各識別ポイントが1件以上を参照」で件数を縛らない。recall と script のタスクで戻せる。
  requirement_ids:
  - R-4
- id: D-208
  subject: 許可リストが効いた後の拒否リスト
  reach: local
  status: settled
  settled_by: loop
  answer: argv から外す。
  rationale: 二重実装を避ける(作業規律2)。C-024 は拒否リストを外した状態での一致を要求する。argv の関数1つ。
  requirement_ids:
  - NFR-8
- id: D-209
  subject: タイムアウト時の終了シグナル
  reach: local
  status: settled
  settled_by: loop
  answer: SIGTERM を挟まず、プロセスグループに SIGKILL を送る。
  rationale: 10 秒の予算を猶予と分け合わないため。子プロセスの起動点のタスク1つで変えられる。
  requirement_ids:
  - R-3
- id: D-210
  subject: 答えの要素ごとの含意判定の reference
  reach: local
  status: settled
  settled_by: loop
  answer: 対象の正解を明示し、正解 N 件も併記する。
  rationale: 対象の正解1件だけにすると、別の正解の言い換えが混ざっても気づけない。entailment の関数1つで変えられ、C-013 の主張は動かない。
  requirement_ids:
  - NFR-1
