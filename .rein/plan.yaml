  answer: 1問分のセグメント列(Prompt, Pause, Answer, Discrimination?)を最小単位とし、問の境界でしか割らない。Prompt|Pause|Answer を最小単位にすると最後の Answer の直後が正当な境界になり、Discrimination だけのパート(Pause を含まない)が作れて AR-8 の穴が復活する。どのパートも Pause を1つ以上含み Prompt で始まることをテストで固定する。1問分でも3分を超える場合は分割せず再生成側へ倒す(AR-8 / S-3)。
  requirement_ids:
  - R-6
  - R-7
- id: D-066
  subject: 品質ゲートの smoke ステップが赤いまま mandate を開けること
  reach: mandate
  status: settled
  settled_by: human
  answer: '既知の赤として rein baseline measure --freeze で凍結する。smoke は CLI の入口を叩くが、CLI は src/ に住み、src/ は guard.paths にあるので承認まで書けない。config.yaml は承認で凍結されるため『承認前に緑にする』ことが原理的にできない順序になっている。required: false なので DoD はブロックしない(AR-20)。'
  requirement_ids:
  - NFR-5
- id: D-067
  subject: R-2 の selector_kind をどう決めるか
  reach: local
  status: settled
  settled_by: loop
  answer: 実行時にどの抽出規則が実際にマッチしたかから導出し、フォールバック枝ごとに別の値を返す。定数にすると『全問で同一種別』の判定が恒真式になる。加えて、集合サイズが 2 になって赤くなる negative control フィクスチャを置く。
  rationale: 抽出器の内部実装。claim の文面(根拠が目視で追跡できる)も受入基準の文言も動かないが、判定が恒真式かどうかという意味では証拠能力そのものなので、negative control とセットで初めて local と言える。
  requirement_ids:
  - R-2
- id: D-068
  subject: 出題のシャッフル seed の導出元
  reach: local
  status: settled
  settled_by: loop
  answer: セッション ID × 問題 ID。問題 ID だけだと同じ問題がいつ出題しても同じ順列になり、事前で位置を覚えた人が事後でも当てられる。同一問題の2セッションで presentation が異なることを機械判定する。
  rationale: seed の導出は scoring/session.py 1ファイル。受入基準の文言(事後テストではシャッフルされる)は動かず、その目的を満たす形に直しただけ。
  requirement_ids:
  - R-8
- id: D-069
  subject: ports/browser.py と LLM レスポンスキャッシュを置くか
  reach: local
  status: settled
  settled_by: loop
  answer: どちらも置かない。抽出器を HTML 文字列の純粋関数にした時点でテスト容易性は得られており、D-008 が挙げるのは LLM・TTS・音声認識でブラウザは入っていない。LLM レスポンスキャッシュはどの要件も強制しておらず、置くと R-3 の『2回の実行で API 呼び出しが2倍』基準がそれを検出するために存在することになる。
  rationale: どちらも足す方向なら後からできる。落とすことで壊れる受入基準は無い。
  requirement_ids:
  - R-2
  - R-3
  - NFR-4
- id: D-070
  subject: inputs_digest の構成要素
  reach: local
  status: settled
  settled_by: loop
  answer: 前段成果物の内容 + プロンプトテンプレートの digest + モデル ID + 生成パラメータ。ステージ実装コード自体は入れない。前者が欠けるとプロンプトを直しても旧成果物がキャッシュヒットで返り、後者を入れると無関係な編集で全ステージが再実行されてコストが毎回乗る。
  rationale: pipeline/stage.py の digest 関数。NFR-4 の受入基準(前段の呼び出し0)は動かない。
  requirement_ids:
  - NFR-4
- id: D-071
  subject: 学習記録へのアクセス経路
  reach: local
  status: settled
  settled_by: loop
  answer: DeckScopedStore(deck_id) 経由に限定し、生の接続を store/location.py の外に出さない。deck_id 列だけだと WHERE を1本書き忘れた集計クエリが型検査にも mypy strict にも引っかからず、2デッキ分を合算する。
  rationale: store/ の内部設計。R-11 の受入基準(記録がセット単位で分離される)の文言は動かず、それを構造で保証する形にしただけ。
  requirement_ids:
  - R-11
  - R-8
  - R-10
- id: D-072
  subject: Web UI と API のオリジンとサーバのスレッドモデル
  reach: local
  status: settled
  settled_by: loop
  answer: Next.js の rewrites で同一オリジンに寄せ、ThreadingHTTPServer を使い、SQLite の接続はリクエストごとに開いて閉じる。out/ の配信は読み取り専用エンドポイント1本。BaseHTTPRequestHandler は preflight の OPTIONS に 501 を返すので、そのままでは回答の送信が失敗する。
  rationale: server/ の内部設計。R-12 の受入基準の文言は動かない。
  requirement_ids:
  - R-12
- id: D-073
  subject: R-10 の復習用再生リストと R-7 の連番の共存
  reach: local
  status: settled
  settled_by: loop
  answer: out/<deck>/review/ の別系列へ複製(可能ならハードリンク)して誤答率順の連番を振る。out/<deck>/audio/ の改名は R-7 の『ファイル名昇順で意図した順に並ぶ』を壊す。グロッサリが D-049 で採っているのと同じ形。
  rationale: 出力レイアウトの選択。両方の受入基準が同時に成立する形を選んだだけで、文言は動かない。
  requirement_ids:
  - R-10
  - R-7
- id: D-074
  subject: サンドボックスイメージへ依存を焼く手段
  reach: local
  status: settled
  settled_by: loop
  answer: uv.lock から uv export で導出した requirements.txt を .rein/oci/quiz-sift/ に置き、Containerfile はそれを COPY して uv pip install する。lock を直接 COPY できないのは rein oci build のビルドコンテキストが Containerfile のディレクトリだから。派生物が lock と一致していることを tests/test_gate_environment.py が検査する。
  rationale: ビルド手段の選択。ADR-001 の決定(依存をイメージに焼く)は動かず、その実現方法を1つに決めただけ。一致検査があるので、手で編集された版が黙って焼かれることはない。
  requirement_ids:
  - NFR-6
  - NFR-5
- id: D-075
  subject: 外部 API 呼び出しに失敗があった実行をどう扱うか
  reach: local
  status: settled
  settled_by: loop
  answer: 下流ステージへ進ませず非0終了する。サマリに未分類比率・最大クラスタ比率・失敗件数の3値を出し、失敗スタブに対する command 証拠を1本置く。
  rationale: 『外部呼び出しが失敗した』という事実についての規則であって、圧縮の質についての閾値ではないので D-004(実データに合格ラインを置かない)と衝突しない。R-7 の SynthesisReport が既に同じ形。要件 R-3 に基準として書き足したが、これは基準の追加であって既存基準の軟化ではない。
  requirement_ids:
  - R-3
- id: D-076
  subject: artifact 実測(5本)の実行主体
  reach: mandate
  status: settled
  settled_by: human
  answer: 人が事前にホスト環境を用意し(CosyVoice の導入、npm ci、next build)、実測コマンドはループが実行する。external にはしない — D-003 が evidence 待ちを発生させないと決めているため。セットアップ手順は /tasks で決め、該当タスクの前提条件として明記する(N-2)。
  requirement_ids:
  - R-7
  - R-12
  - R-2
  - R-3
  - NFR-2
- id: D-077
  subject: gate.sh をリポジトリのどこに置くか
  reach: mandate
  status: settled
  settled_by: human
  answer: リポジトリ直下。当初 scripts/ に置いたが、scripts/ は guard.paths に含まれ mandate 未承認では書き込みが拒否される。Bash のヒアドキュメントで書いたため PreToolUse フックを素通りしていた(src/ に続いて2回目)。直下へ移して境界を戻した(N-3)。
  requirement_ids:
  - NFR-5
- id: D-078
  subject: src/quiz_sift/** に書き込むタスクの DAG 上の位置(T-007 への依存を宣言するか)
  reach: mandate
  status: settled
  settled_by: human
  answer: T-001〜T-004 に blocked_by:[T-007] を足し、T-007 を DAG の単一ルートにする。T-007 の受入基準 A-1 が作る src/quiz_sift/__init__.py
    が無いと quiz_sift は名前空間パッケージになり、bash gate.sh types(mypy .)が同じファイルを domain.ids と quiz_sift.domain.ids
    の二重に解決して全チェックを中断する。src/quiz_sift/** に書き込むタスクは 20 本あり、そのすべてが types の緑をこのファイルに依存している。初版 DAG
    は T-001〜T-004 と T-007 を同格ルートに置いたため T-001 がこの赤で blocked になり(2026-09-22、実測 $4.83/18分)、消費順では
    T-007 が5番目なので再実行しても手前の4タスクが同じ赤を踏む。消費順はループの裁量だが、これは DAG の欠落辺なので /revise で直した。
  requirement_ids:
  - NFR-5
  - NFR-6
- id: D-079
  subject: T-007 の受入基準 A-4 が要求する実測ログ docs/test/measurements/pre-commit.md をどの scope に置くか
  reach: mandate
  status: settled
  settled_by: human
  answer: T-007 の scope.include に足す。A-4 は「pre-commit run --all-files の実測ログが docs/test/measurements/pre-commit.md
    に記録され、記録された終了コードが 0 である」ことを tests/measurements/test_pre_commit_log.py で判定するが、そのログの置き場が scope
    に無かった。書けば scope_violation、書かなければ判定テストが赤のままで gate.sh test が全タスク分赤くなる。同種の成果物を持つ T-019(golden-set.md,
    extraction-run.md) / T-020(full-run.md, reproducibility.md, audio-silence.md) / T-021(gitignore-equivalence.md,
    ui-e2e.md) はいずれも自分の docs/test/measurements/*.md を scope に持っており、T-007 だけの抜けだった。判定方法も基準も変えず、抜けていた1パスを足すだけに留める。
  requirement_ids:
  - NFR-5
  - NFR-6
- id: D-080
  subject: T-021 の受入基準 A-2 が要求するスクリーンショットをどの scope のどのパスに置くか
  reach: mandate
  status: settled
  settled_by: human
  answer: T-021 の scope.include に docs/test/measurements/ui-e2e/ を足し、PNG をそこへコミットする。当初
    out/ui-e2e/ に置いたが、これは T-021 自身(kind が integration で、リポジトリルートで走る)でしか緑にならない。parallel
    タスクは git worktree add の追跡ファイルだけのチェックアウトで走るので out/ が存在せず、DoD の test ステップ(pytest -q
    で全スイート)が tests/measurements/test_host_check_logs.py::test_ui_e2e_passed_and_screenshots_exist
    で以降の全タスク分赤くなる。T-018 が実際にこれで blocked になった。品質プロファイルが worktree を bind マウントするため
    gitignore 対象もサンドボックスから見えること自体は実測で確かめてあるが、見えるかどうかはそのタスクがどの木で走るかに依存し、判定の緑が環境に依存するのは証拠として弱い。判定方法も基準の文言も変えず、抜けていた1パスを足すだけに留める。同じ形の欠落は
    D-079(T-007 の pre-commit.md)に続いて2件目。
  requirement_ids:
  - NFR-5
  - NFR-6
- id: D-081
  subject: T-021 の E2E をどのデータに対して走らせるか(コミットされるスクリーンショットに教材本文が写る経路)
  reach: mandate
  status: settled
  settled_by: human
  answer: 架空のデッキに対してのみ走らせる。実教材から取り込んだデッキに対して走らせてはならない。D-080
    でスクリーンショットが追跡対象になるため、実データに対する E2E は NFR-2(実教材の本文を Git
    追跡対象のファイルに入れない)を画像として破る経路になる。初回の実測は架空の4問のデッキで走っており偶然この制約を満たしていたが、T-019
    / T-020 が out/ に実データを置いた後に E2E を回し直すと次は破れる。制約として plan に書き、偶然に頼らない。
  requirement_ids:
  - NFR-2
  - R-12
- id: D-082
  subject: コミットするスクリーンショットを、レビューの coverage 上どう扱わせるか
  reach: mandate
  status: settled
  settled_by: human
  answer: T-021 に受入基準 A-3 を足し、evidence.kind を artifact にして PNG 4枚のパスを1本ずつ正確に名指す。rein
    0.9.5 では、artifact 基準がパスを正確に名指したバイナリは review.yaml の evidence_files に記録され、coverage
    を insufficient にしない。宣言の無いバイナリは従来どおりブロックし、ディレクトリの artifact は配下を免除しない(ディレクトリの実在を主張しているだけで、そこに落ちた何かが証跡であるとは言っていない)ため、ファイル名を1本ずつ書く必要がある。0.9.4
    ではこの逃げ道が無く、バイナリ1つで coverage が insufficient になり、critical な変更では受入がブロックされ、その処方箋(scope
    から切り出す)は実行不可能だった。upstream に issue 79 として起票し 0.9.5 で修正された。A-2(終了コード 0・手順・パスの実在をログから判定する
    command 基準)はそのまま残す — A-3 が引き受けるのは「バイナリが証跡である」という宣言だけ。
  requirement_ids:
  - R-12
- id: D-083
  subject: レビュー予算 review_policy.budgets.max_diff_bytes を既定の 512 KiB のままにするか引き上げるか
  reach: mandate
  status: settled
  settled_by: human
  answer: 1 MiB(1048576)へ引き上げる。この変更は 23 タスク分で source 417.5 KB + test 422.5
    KB になり、T-003 / T-006 / T-019 / T-020 が critical なので composition の設定によらず丸ごと1回読まれる。段ごとの実測では、blind
    extractor が受け取る source 半分は 417,852 バイトで既定に収まり、超えるのは source と tests の両方を受け取る
    security reviewer の 840,373 バイトだけ。rein 0.9.4 ではロックファイルの本文が畳まれる前に測られていて 0.99
    MB と出ていたが(upstream に issue 78 として起票、0.9.5 で修正)、畳んだ後の 0.84 MB は水増しではなく1回の
    launch に実際に渡る量なので、実体のある超過として引き上げで応じる。もう一方の出口である「claim
    を削ってサイクルを分割する」は、20 タスクが既に done でマージ済みの時点では cycle-close
    して切り直す作業になり、割に合わない。これはこのアダプタのコンテキスト窓についての主張であって、人が一度に読める量についての主張ではない
    — 受入側に上限は無いままで、そこは変えていない。
  requirement_ids:
  - NFR-5
