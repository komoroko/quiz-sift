          - 要約の指示(`SUMMARIZE_SYSTEM`)は「問題文に無い語句を持ち込まない」の1文だけで、スキーマに長さの制限もありません。

          - そのため Opus が見出し付きで 2507 字の要約を返し、名詞句が 248 個になりました。

          - クラスタの問題本文に無い語句は 10 個でした。デッキ全体と照べても、モデル自身の見出し語など 4 個が残ります。

          - 設計 R-3 は「名詞句がすべて実在すること」を求め、1語でも欠ければ止めます。この条件では、37 クラスタの要約がすべて通る見込みはありません。同じコードで再実行しても、戻せないレート枠を使うだけです。


