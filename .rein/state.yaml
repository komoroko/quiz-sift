            _statements の `if any(e.option_id not in question.correct_option_ids ...)` の行と _asks の `if
            any(d not in texts or d in question.correct_option_ids ...)` の行を消しても、A-1〜A-5 と tests/safety・recall・script
            のどのテストも赤にならない。そのとき誤答を指す distractor_ids は texts[d] でそのまま誤答の本文として渡り、別の問題の選択肢は KeyError になって、意味のある失敗にならない。_statements
            と _asks に誤った focus・distractors を持つ素材を渡して ValueError を見るテストを足す。'
