  answer: 要件の文面どおり「主要な語句」に戻す。照合するのは要約の専門用語の断片だけにし、その定義は D-161 に置く。漢字だけの一般名詞(判断、要点)は照合しない。あわせて要約プロンプトで長さと形を縛る(D-160)。mandate の scope に src/quiz_sift/cluster/summary.py を足す。
  rationale: 要件は「主要な語句が実在する」で、設計が「名詞句のすべて」に強めていた。一般名詞はモデルが要約を書くたびに持ち込み、1語で列全体が止まる。捏造の害が大きいのはサービス名などの専門用語で、そちらは英字かカタカナで書かれるので引き続き止まる。凍結済みの test_c003 は、スタブ要約の名詞句すべてが実在することを assert している。これはスタブの性質であって、製品のガードの範囲ではない(AR-173)。
