  - id: A-2
    statement: ClaudeCliLlm.__init__ の本体は、属性代入と引数なしのクラス呼び出しだけである。if / match / try / 添字 / os.environ / ファイル読み出し / importlib を含まず、キーワード既定値を持たない(AST で判定する)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_llm_claude_cli.py::test_init_body_is_assignments_and_bare_class_calls
      executor_profile: quality
  - id: A-3
    statement: Workspace を tmp_path を根にした実物のまま使い、spawn だけを fake に差し替えて呼び出す。このとき、製品が HOME 配下に作成したファイルは 0 件で、runner が観測した env のキーは {HOME, PATH, LANG, TZ} と一致する。CommandSpec.cwd はその呼び出しの new_cwd() であり、spawn の時点で空である。
