          **止めた理由**\n設計(R-6)のとおりに型を変えると、T-064 の scope 外にある次の3ファイルを直さないと test と types のゲートが通りません。\n- 設計の変更:\
          \ `Answer(texts: tuple[str, ...])` にし、`Discrimination` に `distractor_ids` を足す。\n- 影響する3ファイル:\
          \ どれも `Answer(\"…\")` / `Discrimination(\"…\")` を1引数の文字列で直接組み立てている。\n  - `tests/audio/conftest.py:46-47`\n\
          \  - `tests/domain/test_shared_types.py:101,124-125`\n  - `tests/glossary/test_audio_series.py:39`\n\
          \n`rein task scope-add` は、`guard.scope_additions` が設定されていないとして拒否されました。\n\n**scope 内で通す手段もありましたが、採っていません**\n\
          - `distractor_ids` に既定値 `()` を置く: 互換シムになり、参照先の ID が無い識別ポイントを型として許してしまいます。\n- 台本の `Discrimination`\
          \ には ID を持たせず、`generate_scripts` の中で想起素材から引く: 設計の「Discrimination に distractor_ids を引き継ぐ」から外れます。\n\
          \n**判断してほしいこと**\n`/revise` で、上の3ファイルを T-064 の scope に足してください。足せば、受入基準 A-1〜A-3 は設計どおりにそのまま実装できます。"
