  security:
    findings:
    - id: SEC-001
      severity: medium
      category: sandbox_escape
      attack_scenario: The preflight is the only barrier that keeps configuration out of the `claude`
        child. It checks only `.claude/CLAUDE.md`, `.claude/rules/` and the top-level keys of `.claude/settings.json`
        under the minimal home. The home probe measured that HOME-side settings can inject `env` (for
        example ANTHROPIC_BASE_URL) even under `--safe-mode`. The preflight does not look at `.claude/settings.local.json`
        or `$HOME/.claude.json` in the same home. Someone who can write one of those files (another local
        tool, a synced plugin, a careless edit) can set env such as ANTHROPIC_BASE_URL or ANTHROPIC_AUTH_TOKEN,
        or hooks. That redirects every study-material prompt to a server they control, or moves the calls
        onto a metered path, and the preflight still passes. Not verified on the host whether the CLI
        reads settings.local.json from HOME under --safe-mode.
      code_anchors:
      - path: src/quiz_sift/adapters/claude_process.py
        start_line: 123
        end_line: 139
        blob: git-blob:949d55dd0dd57e6366e367dacd842a86164b6a9d
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: e6bd1676ff10bf4e6cf466dc94cb5a8eca77d51c
    - id: SEC-002
      severity: low
      category: denial_of_service
      attack_scenario: When a call times out, `SubprocessRunner.run` kills only the direct `claude` child
        and then calls `proc.communicate()` with no timeout. The child's stdout and stderr pipes are inherited
        by any grandchild it started (node workers, helper processes). If a grandchild survives the kill,
        it keeps those pipes open and the second communicate() blocks forever. The 10-minute per-call
        timeout then fails, and the run can only end when the 12-hour alarm fires.
      code_anchors:
      - path: src/quiz_sift/adapters/claude_process.py
        start_line: 58
        end_line: 63
        blob: git-blob:949d55dd0dd57e6366e367dacd842a86164b6a9d
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: e6bd1676ff10bf4e6cf466dc94cb5a8eca77d51c
    - id: SEC-003
      severity: low
      category: information_disclosure
      attack_scenario: Every invocation writes the child's full stdout to the INFO log, and that log goes
        to stderr. MaterialTextFilter masks only question text that appears verbatim. Model output that
        paraphrases or quotes part of the paid course material (summaries, answers, discriminations, thinking)
        passes through unmasked. Anyone who collects or shares these stderr logs, such as the full-run
        journal's .stderr files or a CI log, gets reconstructable course content, which NFR-2 is meant
        to keep out of anything shareable.
      code_anchors:
      - path: src/quiz_sift/safety/invocation_log.py
        start_line: 66
        end_line: 84
        blob: git-blob:a3d0a20305c2b9d2e5aba4e00290208cf6f1a2cd
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: e6bd1676ff10bf4e6cf466dc94cb5a8eca77d51c
