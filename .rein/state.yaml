    handoff:
      review:
        findings:
        - severity: must_fix
          statement: 'focus は正解の選択肢、distractors は誤答の選択肢でなければならないという検査(「取り違えは黙って通さない」)は、変更前は tests/safety/test_entailment.py::test_reference_text_holds_the_right_sections
            が reference_for(question, focus=b) と reference_for(question, distractors=(a,)/(別の問題の B,))
            の ValueError で確かめていた。この変更でその assert は消え、検査は recall/generate.py:237-241 の _statements と script/generate.py:133-135
            の _asks に移ったが、移った先を通るテストが差分のどこにも無い(tests/ に『正解の選択肢でなければ』『誤答の選択肢でなければ』を見るものが無い)。A-4 は『性質そのものは落とさない』と求めている。再現:
            _statements の `if any(e.option_id not in question.correct_option_ids ...)` の行と _asks の `if
            any(d not in texts or d in question.correct_option_ids ...)` の行を消しても、A-1〜A-5 と tests/safety・recall・script
            のどのテストも赤にならない。そのとき誤答を指す distractor_ids は texts[d] でそのまま誤答の本文として渡り、別の問題の選択肢は KeyError になって、意味のある失敗にならない。_statements
            と _asks に誤った focus・distractors を持つ素材を渡して ValueError を見るテストを足す。'
          anchor: src/quiz_sift/recall/generate.py:237
