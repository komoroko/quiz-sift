  - id: AST-002
    statement: On subprocess.TimeoutExpired the runner sends SIGKILL to the whole process group (os.killpg(proc.pid)),
      ignoring ProcessLookupError, then calls _stop_group, which waits up to KILL_GRACE_SEC=5 more seconds
      in communicate(); if that times out it closes the pipes itself, waits for the child, and returns
      only the partial stdout/stderr carried on the TimeoutExpired exception (or b""). The result is Outcome.TIMEOUT
