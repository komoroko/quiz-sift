  - id: DC-022
    question: 'SEC-003 (information_disclosure, severity low): `log_invocation` writes each child''s full
      stdout and stderr at INFO. That output includes the model''s restatement of the study material and
      its tool inputs. Masking only removes registered verbatim material text and known secret shapes.
      Paraphrased or translated question and answer text, and any file contents a tool returned, pass
