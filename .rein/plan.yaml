  - id: A-9
    statement: (h) を実 Meter を通して判定する。実物の success フィクスチャを返す呼び出しでは overage_check が passed になる。ファクトリで isUsingOverage を真にした形では、その呼び出しが PROVIDER_ERROR の失敗になり、overage_check が failed になる。rate_limit_event を落とした形では unknown になる。これは unknown を passed に潰す実装を赤にする negative control である(D-125、D-140)。
