      executor_profile: quality
  - id: A-6
    statement: SubprocessRunner は子プロセス1本ごとにタイムアウト(既定 10 分)を持ち、超過で子を終わらせて FailureKind.TIMEOUT を返す。プロンプトは stdin でだけ渡り、一時ファイルを作らない。
