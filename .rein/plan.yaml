  - id: A-4
    statement: usage は成否の判定より先に meter へ渡る。PARSE / SCHEMA / TRUNCATED / INCOMPLETE_IDS / PROVIDER_ERROR のどれで終わった呼び出しでも、トークンが記録される。1回の classify_clusters は 25 問ごとに分割されて provider_invocations を増やし、llm_calls は 1 だけ増える。失敗は ClassificationResult.failures に入り、その reason は FailureKind の値で始まる。再試行はしない。
    evidence:
