  - id: DC-023
    question: 'SEC-004 (denial_of_service, severity low): On `TimeoutExpired`, `SubprocessRunner.run`
      kills only the direct child and then calls `proc.communicate()` with no timeout. If `claude` has
      spawned a grandchild that inherited the stdout/stderr pipes (a helper, or a subprocess started by
      a tool), that call blocks until the grandchild exits. The 10-minute per-call timeout therefore stops
      working, and the run hangs until the 12-hour `signal.alarm` fires, holding the minimal-home lock
      and blocking every other run. What is done about it?'
    risk: low
    options:
    - id: A
      statement_id: STMT-108
    - id: B
      statement_id: STMT-109
    - id: C
      statement_id: STMT-110
    - id: D
