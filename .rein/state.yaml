          **ホストでの実測結果**(argv は製品の `build_argv`。`--setting-sources ""` と `--tools ""` を使い、拒否リストはありません)

          - **init.tools**: 最終 argv で `{StructuredOutput}` と一致しました(`docs/test/measurements/claude-cli-hardening.md`)。

          - **SEC-001 の番兵**: ユーザ設定の遮断を外した argv では、番兵のアドレスへの接続が `ECONNREFUSED` で失敗しました。最終 argv では成功しました。

          - **最小ホームの後始末**: `settings.json` は sha256 が一致し、元のバイト列(`{"theme": "dark"}`)に戻りました。

          - **契約フィクスチャと home-probe**: 取り直しました。home-probe の陽性対照(最終 argv からユーザ設定の遮断と `--safe-mode` を外した
          argv)では、4 つの番兵がすべて返りました。

          - **固定オーバーヘッド**: 2 モデルを測り直しました。切片は haiku が 1224.33、opus が 1060.33 で、どちらも num_turns 2 です。`OVERHEAD`
