  subject: 実行の列の途中で許す「レート枠による停止」をどう見分けるか(AR-113)
  reach: mandate
  status: settled
  settled_by: human
  answer: '止まった呼び出しの result が is_error 真で、その実行で最後に届いた rate_limit_event の status が rejected、かつ isUsingOverage が偽であること。rate_limit_event が届かない停止・PARSE 等の停止・overage による停止は列を完走不可にする。status の値域(allowed / allowed_warning / rejected)は claude 2.1.282 の実行ファイルのスキーマから読んだもので、枠切れの実物は未観測。 再レビュー(AR-113a/b)を受け、判定は呼び出し単位とする: 失敗したすべての呼び出しが、それぞれ自分の子プロセスが最後に出した rate_limit_event で rejected かつ isUsingOverage 偽を持つこと。加えて列全体で isUsingOverage 真が 0 件であることを完走の条件にする(人間が承認した定義を、並行時に他の呼び出しのイベントを借りられないよう精緻化したもの。より厳しい側への変更)。'
