- id: D-086
  subject: 教材本文が Claude Code のセッション記録(~/.claude/projects/**/*.jsonl)にホスト上へ平文で残ることを許容するか
  reach: mandate
  status: settled
  settled_by: human
  answer: そのまま許容する。保持期間の設定(cleanupPeriodDays、バイナリに実在することを確認済み)も触らない。NFR-2 の criterion(リポジトリと本プロダクトが書き出すファイル)は破らないが、教材本文の第三の平文コピーがホームディレクトリに蓄積されることを保護境界の定義として NFR-2 に明記する。
  requirement_ids:
  - NFR-2
  - NFR-8
- id: D-087
  subject: NFR-8(従量課金を伴わない)の証拠をどこまで要求するか
  reach: mandate
  status: settled
  settled_by: human
  answer: 静的検査と環境変数遮断のみ((a)〜(d))。実行時に stream-json の init イベントが返す apiKeySource を毎回検証すれば肯定的証拠になる(2026-09-24 に実測、値は none)が、本サイクルでは課さない。結果として NFR-8 は「metered 経路を取らなかった」の否定的証拠にとどまり、ホスト側設定(apiKeyHelper、~/.claude.json)経由で metered 経路に入る可能性は製品コードでは塞げない。実際に課金が発生しなかったことの確認は課金画面の目視であり Out of scope(D-003 により external evidence の待ちは作れない)。
  requirement_ids:
  - NFR-8
- id: D-088
  subject: T-020 の不可逆ゲートの根拠が、LLM API の課金の消滅によって失われることへの対応
  reach: mandate
  status: settled
  settled_by: human
  answer: 根拠を「教材本文がホストの Claude Code セッション記録に書かれること(D-086)」と「サブスクリプションのレート枠の消費」に差し替え、operator_surface の reversible=false と rein approve T-020 を残す。人間承認の回数は変えない。
  requirement_ids:
  - NFR-2
  - NFR-7
  - NFR-8
- id: D-089
  subject: notional コストを自算値と申告値のどちらで記録するか
  reach: local
  status: settled
  settled_by: loop
  answer: 両方を記録し、両者の差分をログから追跡できるようにする。
  rationale: 覆しても pipeline/meter.py 1タスクぶんで、claim も受入基準も動かない。両方を要求するのは、片方だけだと AR-24 の「常に 0.0 を返す実装」と、新たに生じる「申告値をそのまま転記する実装」のどちらかが必ず通るため。JSON のフィールド名や差分の出し方といった実装細部はループが決める。
  requirement_ids:
  - NFR-7
- id: D-090
  subject: Anthropic SDK アダプタを依存としてどう残すか
  reach: local
  status: settled
  settled_by: loop
  answer: pyproject.toml の optional extra として残す(通常依存にも、依存から外してデッドコードにもしない)。2026-09-25 に D-103 がこれを今サイクルについて覆した — 本サイクルは通常依存のままとし、extra 化は次サイクルに回す。
  rationale: 覆しても pyproject.toml・adapters/llm_anthropic.py・サンドボックスイメージの requirements.txt の1タスクぶんで、claim も受入基準も動かない。依存から完全に外すと llm_anthropic.py が未解決 import になって NFR-5 (b) の ruff・mypy strict が赤くなり、通常依存のまま残すと NFR-8 (a) の「実行時に import されない」を保証するコードが要るうえ security.dependency_audit の対象であり続ける。extra なら mypy の overrides で ignore_missing_imports を当該モジュールにだけ限定でき、その経路は既に設計にある。
  requirement_ids:
  - NFR-5
  - NFR-8
- id: D-091
  subject: CLI 経路のレート制限到達を「失敗」として扱うか「待機」として扱うか
  reach: mandate
  status: settled
  settled_by: human
  answer: 失敗として扱う(2026-09-25 に、当初のループ判断「待機して継続」を人間が撤回して差し替えた)。レート制限は特別扱いせず PROVIDER_ERROR として失敗に数え、下流へ進まず非 0 終了し、resetsAt をログに残す。人が枠のリセット後に再実行する。撤回の理由は、設計レビューの2巡目で「レート制限と判定できる既知の値が1つも無い」ことが判明したため — 観測できた status は allowed_warning だけで、これは成功した呼び出しにも付いてくる。これを除外するとホワイトリストが空になり、RateLimited の枝に到達する入力が存在しないまま「待機して継続」という成立条件の無い基準を凍結することになる。NFR-4 の段階キャッシュが「完了した段は呼び直さない」を既に保証しているので、再開に新しい仕組みは要らない。
  requirement_ids:
  - R-3
  - NFR-7
- id: D-092
  subject: NFR-8 (e)1「有効ツールの集合が空」が CLI 2.1.281 で表現できないことへの対応
  reach: mandate
  status: settled
  settled_by: human
  answer: 許容集合の列挙へ書き換える。init イベントの tools 配列が、要件が列挙する 19 本の許容集合の部分集合であることを求める。2026-09-25 の実測で --allowedTools '' は無効果(28 本のまま)、--settings の permissions.deny で Bash / Read / Write / Edit / NotebookEdit / Task / TaskStop / WebFetch / WebSearch の9本は確実に消えるがセッション管理系 19 本が残ることを確認した。AR-30 で拒否リストをやめたのと同じ形にすることで、CLI の更新で新しい危険なツールが増えた場合も検出できる。
  requirement_ids:
  - NFR-8
- id: D-093
  subject: 本番経路の出力形式
  reach: mandate
  status: settled
  settled_by: human
  answer: stream-json(--output-format stream-json --verbose)と --max-turns 3 以上を既定とする。2026-09-25 の実測で --max-turns 1 では構造化出力にターンが足りず error_max_turns で result が null になること、3 なら --json-schema と併用して成功することを確認した。これにより init イベントの tools と apiKeySource、および rate_limit_event(status / rateLimitType / utilization / resetsAt / unifiedWindows)が本番経路で観測できる。--output-format json では3つとも取れない。
  requirement_ids:
  - NFR-7
  - NFR-8
- id: D-094
  subject: NFR-8 (b) の最小ホームと NFR-3(資格情報を読まない・コピーしない)の矛盾
  reach: mandate
  status: settled
  settled_by: human
  answer: 人間が事前に用意する(ADR-014 Option C)。HOME=~/.quiz-sift-claude-home claude /login を人間が1回走らせ、製品は固定パスを HOME に渡して .claude/.credentials.json の存在を確かめるだけにする。置くのは人間なので製品は資格情報を読みもコピーもせず、NFR-3 と真正面から整合する。使い捨てホーム + symlink 案は、トークン更新の書き戻しで実ホームのログインが壊れうること(未実測)と、教材本文がセッション記録に残らなくなって D-088 が据えた不可逆ゲートの根拠が消えることから採らない。
  requirement_ids:
  - NFR-8
  - NFR-3
- id: D-095
  subject: 既定モデル
  reach: mandate
  status: settled
  settled_by: human
  answer: 混成(ADR-015)。classify_clusters と summarize_cluster は claude-opus-5-5(2026-09-25 に D-117 で 5 から引き上げ)、generate_recall / describe_term / check_entailment は claude-haiku-4-5。呼び出し回数の 95% 以上を占める側を Haiku にすれば枠の消費は Haiku 全面にほぼ等しく、圧縮の質が効く分類・要約には Opus を残せる。Opus 5 が Pro プランで使えることは 2026-09-25 に実測で確認した。
  requirement_ids:
  - NFR-7
  - R-3
  - R-4
  - R-5
  - NFR-1
- id: D-096
  subject: NFR-8 (b) の「最小ホームの内容が1ファイルだけ」の判定時点
  reach: mandate
  status: settled
  settled_by: human
  answer: 「製品が HOME 配下に作成したファイルが 0 件であること」と読み替える。claude は .claude.json・.claude/projects 配下のセッション記録・statsig を必ず書くため、文字どおりの1ファイル判定は2回目の起動から必ず偽になる。測る対象は製品の振る舞いであって CLI の振る舞いではない。
  requirement_ids:
  - NFR-8
- id: D-097
  subject: マスク後の逐語ログに、LLM が言い換えた教材由来テキスト(クラスタ要約・想起素材)が残り Git 追跡対象に入ること
  reach: mandate
  status: settled
  settled_by: human
  answer: 許容する。NFR-2 の criterion は「取り込んだ実教材の本文」を対象としており違反ではない。応答本文まで伏せると、不可逆ゲートで人が読む証拠から LLM の応答そのものが消え、AR-42 が恐れた「証拠が空」に近づく。保護境界の定義に明記する。
  requirement_ids:
  - NFR-2
- id: D-098
  subject: ID 完全性の検査を分類以外のメソッドにも課すか
  reach: mandate
  status: settled
  settled_by: human
  answer: 分類(classify_clusters)だけに課す。他の4メソッドは1問・1語・1対を扱うので「渡した ID の集合」が自明であり、空応答はスキーマ不適合か値の検査で落ちる。要件の対象を広げない。
  requirement_ids:
  - R-3
- id: D-099
  subject: composition.build_default_llm() の右辺に入れ子のクラス呼び出しを許すか
  reach: local
  status: settled
  settled_by: loop
  answer: 許さない。右辺はクラス名の直接呼び出し1つに限る。llm_calls の計数はデコレータ(MeteredLlm)ではなくアダプタ内部に置く。
  rationale: 覆しても composition.py と計数の置き場所というアダプタ1タスクぶんで、claim も受入基準も動かない。入れ子を許すと NFR-8 (c) の AST 判定が「どこまでが選択点か」を決められなくなり、AR-31 が突いた抜け道が戻る。
  requirement_ids:
  - NFR-8
- id: D-100
  subject: LLM 呼び出しの並行度
  reach: local
  status: settled
  settled_by: loop
  answer: 1(直列)で凍結し、MAX_CONCURRENCY を1箇所の定数として置く。
  rationale: 覆してもアダプタとメーターの1タスクぶんで claim は動かない。500〜1000 回 × 3.4〜4.2 秒 = 28〜70 分は R-3 の全体上限 12 時間に収まり、並列化してもレート枠は増えないので枠が binding なら利得はゼロで枠に速く当たるだけ。加えて並列化は最小ホームの共有による同時書き込みを持ち込む(累積待機時間は D-091 撤回で無くなった)。T-020 で枠に余裕があると分かった次サイクルで定数を上げるのは、証拠の追加であって基準の緩和ではない。
  requirement_ids:
  - NFR-7
- id: D-101
  subject: 失敗した呼び出しの再試行方針
  reach: local
  status: settled
  settled_by: loop
  answer: 再試行しない(2026-09-25 に改訂)。どの失敗種別も1回で確定する。D-091 がレート制限を失敗に倒したことで、再試行する対象が1つも残らなくなった。
  rationale: 覆してもアダプタ1ファイルぶん。再試行を入れると R-3 の「失敗件数が実際の失敗数と一致する」の意味が壊れる。この決め方により provider_invocations が llm_calls を超える要因はチャンク分割だけになり、2語の差が常に説明可能になる。
  requirement_ids:
  - R-3
  - NFR-7
- id: D-102
  subject: error_max_turns(--max-turns が足りず構造化出力が届かなかった場合)をどの失敗種別に落とすか
  reach: local
  status: settled
  settled_by: loop
  answer: TRUNCATED として数える。応答の切り詰めと同じ箱に入れる。
  rationale: 覆してもアダプタ1ファイルぶんで claim は動かない。処置が同じ(バッチサイズか --max-turns を見直す)ものを同じ箱に入れるほうが、失敗件数の内訳が次サイクルの判断材料になる。識別材料は subtype の値 error_max_turns と stop_reason で、どちらも実測済み。
  requirement_ids:
  - R-3
- id: D-103
  subject: anthropic の optional extra 化とサンドボックスイメージの再ビルドを、このサイクルでやるか
  reach: mandate
  status: settled
  settled_by: human
  answer: やらない。本サイクルは anthropic を通常依存のまま残し、pyproject.toml・uv.lock・requirements.txt・イメージのダイジェスト・config.yaml を動かさない。extra 化と再ビルドは次サイクルに回す。
  rationale: mandate が凍結する環境(config.yaml のイメージダイジェスト)を動かす判断なので reach は mandate。承認前に extra 化するとイメージから anthropic が消え、現行の cli.py と、AnthropicLlm を import する tests/ports/test_protocols.py・tests/safety/test_entailment.py が import 時点で落ちる。全タスクの test ステップがベースラインから赤になり、切り替えタスクが入るまで build が1本も進まない。承認後に extra 化するとイメージの再ピンが凍結後の config.yaml 変更になる。承認前に製品側を先に直す案はゲート規則1に触れる。NFR-8 (a) は sys.path に置くスタブで import 可能性を満たすので、イメージに実 SDK があってもなくても判定は変わらず、(d) は静的走査なので依存宣言に左右されない。
  requirement_ids:
  - NFR-5
  - NFR-6
  - NFR-8
- id: D-104
  subject: FailureKind をどのモジュールに置くか
  reach: local
  status: settled
  settled_by: loop
  answer: ports/metering.py に置く。adapters/claude_failure.py は判定表と判定順序だけを持つ。
  rationale: RunMeter.record_failure が FailureKind を引数に取るので、adapters に置くと ports が adapters を import する逆向きの依存になる。覆しても2ファイルの import 先が変わるだけで claim は動かない。
  requirement_ids:
  - R-3
  - NFR-7
- id: D-105
  subject: 最小ホームのプロセス間ロックをどう取るか
  reach: local
  status: settled
  settled_by: loop
  answer: 最小ホームのディレクトリ自身の fd に fcntl.flock を掛ける。ロックファイルは作らない。取得できなければ待たずにエラー終了する。
  rationale: 設計は当初「HOME 配下のロックファイル」と書いていたが、それは NFR-8 (b) の「製品が HOME 配下に作成したファイルが 0 件」を製品自身が破る。ディレクトリ fd への flock は Linux で成立し、ファイルを作らない。覆してもアダプタ1ファイルぶん。
  requirement_ids:
  - NFR-8
- id: D-106
  subject: init.tools が StructuredOutput 以外を含む呼び出しと、許容外のツール使用が現れた呼び出しを、どの失敗種別に落とすか
  reach: local
  status: settled
  settled_by: loop
  answer: PROVIDER_ERROR として数える。種別は7種のまま増やさない。
  rationale: R-3 が種別を7種に固定しているので新設できない。どちらも「呼び出し経路が契約の外で振る舞った」事実で、PARSE・SCHEMA・TRUNCATED・INCOMPLETE_IDS のどれの定義にも当たらない。逐語ログに理由を残すので、件数の内訳からは区別できなくても記録からは区別できる。覆しても判定表1行ぶん。
  requirement_ids:
  - R-3
  - NFR-8
- id: D-107
  subject: オーバーヘッド定数の argv_digest を、実行時の argv とどう突き合わせるか
  reach: local
  status: settled
  settled_by: loop
  answer: アダプタが begin_invocation に現 argv のダイジェスト(プロンプト・スキーマ本文を除いた形)を渡し、Meter.finish がモデル別の定数の argv_digest と比べる。違えばそのモデルの overhead を unknown と報告する。
  rationale: 設計の RunMeter は begin_invocation() を無引数で書いていたが、それでは meter が現 argv を知る経路が無く、AR-51 への答えである「argv が変われば定数が自動的に無効になる」が実装できない。pipeline が adapters を import しない向きを保てる唯一の渡し方。
  requirement_ids:
  - NFR-7
- id: D-108
  subject: T-029 / T-030(ホストでの実 CLI 実測)を不可逆ゲートにするか
  reach: local
  status: settled
  settled_by: loop
  answer: 'しない。reversible: true とする。'
  rationale: 送るのは合成プロンプトだけで教材本文がセッション記録に残らない(D-088 が T-020 を不可逆にした理由 (i) に当たらない)。レート枠の消費は数回〜十数回で、T-020 の 500〜1000 回とは桁が違う。承認点を増やすと、同じ判断を2回訊くことになる。実行の時期を人が選ぶ仕組みはタスクには無い — T-029 は最初の rein build で着手されるので、人は最小ホームを用意し週次枠のリセット(2026-09-28 08:00 JST)を待ってから rein build を起動する。枠切れで落ちれば PROVIDER_ERROR として blocked になり、それ自体が枠切れ時の形の観測になる。
  requirement_ids:
  - NFR-7
  - NFR-8
- id: D-109
  subject: 計測(NFR-7)の作り直しを、T-002 を開き直して行うか新規タスクで行うか
  reach: local
  status: settled
  settled_by: loop
  answer: 'T-002 は keep(done のまま、計画の記述も変えない)とし、作り直しは新規タスク T-031(blocked_by: T-002)で行う。T-002 の A-2 / A-3 が名指す estimated_cost と test_meter_records_run_fields / test_token_breakdown_and_price_provenance は T-031 が置き換える。'
  rationale: rein task reset T-002 は、done の依存タスク11本が未完了タスクの下流に取り残されるとして拒否した。これは正当な拒否で、11本はいずれも Llm ポート越しにしか計測に触れず、作り直しで振る舞いが変わらない。T-002 の operator_surface が名指す ANTHROPIC_API_KEY は、残る SDK アダプタについては今も真で、製品経路から到達しないことは T-028 の operator_surface と NFR-8 (a)(d) が示す。
  requirement_ids:
  - NFR-7
- id: D-110
  subject: ended_by_rate_limit をどう判定するか(D-091 撤回後、レート制限を識別する既知の値が無い)
  reach: local
  status: settled
  settled_by: loop
  answer: 実行を止めた失敗が PROVIDER_ERROR で、その呼び出しの最後の rate_limit_event の status が allowed_warning 以外(イベントはあるが既知の許可状態でない)のとき真とする。status と resetsAt は真偽に関わらず生のまま記録する。
  rationale: レート制限は特別扱いしない(D-091 撤回)ので、この値は処置を分けず、人が再実行の時期を読むための表示にしか使わない。誤判定しても挙動は変わらず、生の値が併記されるので人が読み直せる。枠切れ時の実際の形は未観測で、T-020 の最初の到達で分かる。
  requirement_ids:
  - R-3
  - NFR-7
- id: D-111
  subject: モデルごとのレート枠の重み(AR-59)をどこで測るか
  reach: local
  status: settled
  settled_by: loop
  answer: 独立のタスクにせず、T-030 のオーバーヘッド実測の呼び出し群の前後で utilization を読み、モデル別の差分を実測表に記録する。受入基準にはしない(AR-93。どの claim も要求していない)。
  rationale: オーバーヘッドの実測は既に2モデルを数回ずつ叩くので、前後の rate_limit_event を読むだけで同じデータが取れる。別タスクにすれば枠を二重に使う。どの claim もこの値を要求していないので、記録だけにとどめる。
  requirement_ids:
  - NFR-7
- id: D-112
  subject: レビュー予算 max_diff_bytes を CLI 移行の8タスクに合わせて引き上げるか
  reach: mandate
  status: settled
  settled_by: human
  answer: 1.5 MiB(1572864)へ引き上げる。
  rationale: タスクを足す前の時点で変更は既に 1.02 MB あり、critical タスク(T-003 / T-006 / T-019 / T-020 / T-026 / T-027 / T-028)があるので、acceptance は変更全体を1回で読む。8タスクで src とテストが 150〜300 KB、契約フィクスチャが数十 KB 増える見込みで、1 MiB の超過はほぼ確実。予算は config.yaml にあり mandate で凍結されるので、承認前に決める(AR-80)。D-083 と同じく、これはアダプタのコンテキスト窓についての判断で、人が一度に読める量についての判断ではない。
  requirement_ids:
  - NFR-5
- id: D-113
  subject: 実行ログの estimated_cost を notional_cost に改名するか
  reach: local
  status: settled
  settled_by: loop
  answer: '改名しない。estimated_cost のまま、その中に "notional": true を入れ、同じ行に免責の1行を書く。'
  rationale: 改名すると、done のまま残す T-002 の A-2(estimated_cost が記録される)と A-3 の凍結基準が偽になり、その判定ノードが消える(AR-81)。T-002 は rein が開き直しを拒否した(D-109)。NFR-7 が求めるのは「出力に notional の語を含め、実課金額を主張しない」ことで、キー名ではない。覆しても meter 1ファイルぶん。
  requirement_ids:
  - NFR-7
- id: D-114
  subject: total_cost_usd とレート枠の使用率を、どの口で meter へ渡すか
  reach: local
  status: settled
  settled_by: loop
  answer: end_invocation に cost_usd を足す。レート枠は rate_limit_event を読むアダプタが record_quota(info) で渡し、meter が最初の値を quota_at_start、最後の値を quota_at_end にする。
  rationale: 設計の RunMeter には total_cost_usd を渡す口が無く、record_quota は cli が呼ぶ前提だったが、Llm Protocol を変えない方針では cli が RateLimitInfo を観測できない(AR-82)。アダプタだけが観測できるので、アダプタから渡す。覆しても meter とアダプタの2ファイルぶん。
  requirement_ids:
  - NFR-7
- id: D-115
  subject: claude の不在と最小ホームの不正を、いつ検査するか(R-3 の「起動時」)
  reach: local
  status: settled
  settled_by: loop
  answer: claude_process.preflight() を置き、cli の LLM を使う段が最初の LLM 呼び出しより前に呼ぶ。SubprocessRunner() と Workspace() の構築は副作用を持たない。
  rationale: ClaudeCliLlm.__init__ は引数なしのクラス呼び出ししか許されず(NFR-8 (c) と同じ AST 制約)、構築時に検査すると、サンドボックス内のテストが fake を差す前に構築で死ぬ。「起動時」をどこと読むかが決まっていないと、最初の呼び出しまで検査しない実装が緑になる(AR-84)。
  requirement_ids:
  - R-3
  - NFR-8
- id: D-116
  subject: 実行ログの overhead に material を置くか
  reach: local
  status: settled
  settled_by: loop
  answer: 置かない。恒等式 Σ overhead×turns + material = 合計 は、material が独立に分かる T-030 の較正表の上でだけ判定する。
  rationale: フル処理で material を独立に得る手段は無く、出すなら「合計 − Σ overhead×turns」になり、AR-51 が禁じた恒等式に戻る(AR-87)。C-019 の恒等式の適用範囲を較正表と明記した。
  requirement_ids:
  - NFR-7
- id: D-117
  subject: 製品が分類と要約に使う Opus の版
  reach: mandate
  status: settled
  settled_by: human
  answer: claude-opus-5-5 に固定する(claude-opus-5 から引き上げ)。エイリアス opus にはしない。
  rationale: ADR-015 の claude-opus-5 は旧 SDK アダプタの定数を引き継いだ値だった。単価は T-031 が料金ページから取り、オーバーヘッドは T-030 で取り直すので、Opus 5 で測った 14,603 tok(もともと暫定)を失っても困らない。エイリアスはモデル ID が実行ごとに変わりうるので、inputs_digest と単価表の照合が不安定になる。Pro で claude-opus-5-5 が呼べることは T-029 / T-030 の実測で初めて確かめられる。
  requirement_ids:
  - R-3
  - NFR-7
