  acceptance:
  - id: A-1
    statement: 親環境に NFR-8 が列挙した 13 個の metered 認証変数すべてに値を入れた状態で、SubprocessRunner が子プロセスへ渡す環境の変数名の集合が {HOME, PATH, LANG, TZ} と一致し(部分集合ではない)、HOME が最小ホームを指す。期待集合はテスト側に要件から写した定数として置き、実装の定数を読まない。 PATH の値は親の PATH をそのまま写す。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_claude_process.py::test_child_env_is_exactly_the_allowlist
      executor_profile: quality
  - id: A-2
    statement: Workspace(home_root, cwd_root) を tmp_path を根にして実物のまま走らせ、new_cwd() がリポジトリの外に空ディレクトリを作り、呼び出しの後始末でそれを消す。HOME 配下のファイル一覧は new_cwd と後始末の前後で変わらない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_claude_process.py::test_workspace_makes_an_empty_cwd_outside_the_repo_and_cleans_it
      executor_profile: quality
  - id: A-3
    statement: 最小ホームのロックは最小ホームのディレクトリ自身の fd に対する fcntl.flock で取り、ファイルを作らない。別プロセスが保持している間の取得は待たずにエラー終了する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_claude_process.py::test_second_holder_fails_fast_without_a_lock_file
      executor_profile: quality
  - id: A-4
    statement: claude_process.preflight() が、最小ホームに .claude/.credentials.json が無い、または settings.json / CLAUDE.md / .mcp.json のいずれかがある場合にエラー終了する。資格情報ファイルは存在を確かめるだけで開かない。SubprocessRunner() と Workspace() の構築そのものは副作用を持たない(D-115)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_claude_process.py::test_minimal_home_is_validated_without_reading_credentials
      executor_profile: quality
  - id: A-5
    statement: PATH に claude が無いとき、claude_process.preflight() が非 0 のエラー終了になり、メッセージが claude の不在を名指す。
    evidence:
      kind: command
