  - id: A-6
    statement: 番兵実測の記録が docs/test/measurements/claude-cli-home-probe.md の「## 記録」の yaml ブロックにあり、次の4点を判定する。(1) 採取経路は collect_claude_cli.py にある。4つの場所に、実行ごとに乱数で作った合言葉の番兵を置いて採取する。場所は、最小ホームの .claude/CLAUDE.md、最小ホームの .claude/rules/probe.md、作業ディレクトリの親に置く CLAUDE.md、同じ親の .claude/CLAUDE.md。(2) 設計 argv(--safe-mode あり)で返った合言葉が 0 件である。(3) positive control として、--safe-mode を外した argv で4つとも返る。(4) 後始末の後、4つの番兵が残っておらず、最小ホームの .claude/CLAUDE.md と rules/ は無い。元からあったファイルを置き換えた場合は、元のバイト列の sha256 と一致する。作業ディレクトリの親は、採取スクリプトが作る専用のディレクトリであり、/tmp 直下ではない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_claude_cli_home_probe_logs.py::test_sentinels_are_read_only_without_safe_mode
      executor_profile: quality
      produces:
      - tests/measurements/test_claude_cli_home_probe_logs.py
  operator_surface:
  - kind: dependency
    name: 人が事前に最小ホームを用意しておくこと。合成プロンプトによる実 CLI 呼び出し(成功 2〜4 回、番兵 2 回)ぶんのレート枠を消費する。不正スキーマはモデルを呼ばない
    paths:
    - tests/measurements/collect_claude_cli.py
    reversible: true
    adr: ADR-017
  requires:
  - says: ホストの PATH に claude(Claude Code CLI)がある
    probe:
    - which
    - claude
  - says: 最小ホーム ~/.quiz-sift-claude-home が用意され、資格情報ファイルがある(HOME=~/.quiz-sift-claude-home claude /login を1回。ファイルは開かずに存在だけを見る)
    probe:
