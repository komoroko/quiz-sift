  - id: A-2
    statement: 次の4点を判定する。(1) 各 .meta.yaml の sha256 が、対応する stdout と一致する。(2) tests/fixtures/claude_cli/ の .stdout / .meta.yaml は、A-1 の6ファイルだけである。(3) 3件の argv が設計 NFR-8 節の (e) の argv(stream-json・--verbose・--max-turns 3・インライン --json-schema・--exclude-dynamic-system-prompt-sections・--strict-mcp-config・空の --mcp-config・全ツール deny の --settings・--permission-mode default・--safe-mode)と一致する。テストの BARE_FLAGS には --safe-mode を含める。(4) success のモデルは claude-haiku-4-5、success_opus のモデルは claude-opus-5-5 で、どちらも終了コード 0。invalid_schema は、終了コードが 0 でなく、stderr が 'Error:' で始まり、stdout の sha256 が空文字列の sha256 である(D-119、D-133)。
    evidence:
      kind: command
