  security:
    findings:
    - id: SEC-001
      severity: medium
      category: sandbox_escape
      attack_scenario: 'Question text scraped from a third-party quiz site goes into the `claude -p` child
        on stdin, so it can carry a prompt injection. The child''s tool restriction is a denylist: `DENIED_TOOLS`
        is a hard-coded list passed through `--settings permissions.deny`. There is no allowlist such
        as `--tools StructuredOutput`. If a Claude Code update adds a tool that is not on the list, for
        example a new network, fetch or file tool, that tool is enabled. Injected material can then make
        the model call it from a process whose HOME is the minimal home holding `.claude/.credentials.json`
        (the OAuth token), and use it to read or exfiltrate that token or run other side effects. `claude_failure._tool_problem`
        catches the extra tool only after the child has exited, and only marks the call PROVIDER_ERROR.
        By then the side effect has already happened. The code''s own docstring says the list''s completeness
        is not guaranteed.'
      code_anchors:
      - path: src/quiz_sift/adapters/llm_claude_cli.py
        start_line: 48
        end_line: 133
        blob: git-blob:694b83e522ccbb642322c25b4d7df73280e25032
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: 936af4c852873b0af4c374f15cc15a0174bd794b
