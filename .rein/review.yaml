    statement: 'In the safety module, judge(checker, reference, statements) returns UNCERTAIN without
      calling the checker when there are no statements. Otherwise it calls ask, which raises ValueError
      on duplicate statement ids or a verdict-count mismatch, then aggregates: CONTRADICTED takes precedence,
      then UNCERTAIN, otherwise CONSISTENT. emit_if_consistent is removed, and all statements are sent
      before aggregation.'
