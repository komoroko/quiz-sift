  security:
    findings:
    - id: SEC-001
      severity: medium
      category: sandbox_escape
      attack_scenario: Any process running as the user (or the user themself, e.g. via a synced plugin
        or `claude /login` rewrite) can write child-CLI configuration that the preflight does not inspect.
        The preflight only checks `.claude/CLAUDE.md`, `.claude/rules/`, the top-level keys of `.claude/settings.json`,
        and whether `.credentials.json` exists. `~/.claude.json`, the synced `skills/` and `plugins/`
        trees, and any other settings file the CLI reads are never inspected. The check also runs once,
        before any child is spawned, and the flock is advisory, so the home can be modified between preflight
        and each spawn (TOCTOU). If the attacker adds an `env` or hook-bearing config, e.g. `ANTHROPIC_BASE_URL`
        (measured to take effect under `--safe-mode`, home-probe §2), every child reads it. The result
        is either redirection to a metered or attacker-controlled endpoint that receives the study material
        from stdin, or injected instructions, even though preflight passed.
      code_anchors:
      - path: src/quiz_sift/adapters/claude_process.py
        start_line: 100
        end_line: 148
        blob: git-blob:949d55dd0dd57e6366e367dacd842a86164b6a9d
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: 68951688ba8d813ab6707b1720cf80d1265bd8a8
    - id: SEC-002
      severity: medium
      category: sandbox_escape
      attack_scenario: Tools are restricted by an enumerated deny list (`permissions.deny`), not an allow
        list, and the check that only `StructuredOutput` is enabled (`_tool_problem`) runs only after
        the child has exited. Quiz text scraped from Udemy is untrusted and goes to the model on stdin.
        If a future `claude` release adds a read-only or no-permission tool not in `DENIED_TOOLS`, an
        injected instruction in a question can make the model call it, for example to read `~/.quiz-sift-claude-home/.claude/.credentials.json`
        or other local files. The call executes during the run. `classify` only marks the invocation PROVIDER_ERROR
        afterwards, and by then the tool output is already in stdout, which is written to the INFO log.
      code_anchors:
      - path: src/quiz_sift/adapters/llm_claude_cli.py
        start_line: 49
        end_line: 92
        blob: git-blob:694b83e522ccbb642322c25b4d7df73280e25032
      - path: src/quiz_sift/adapters/claude_failure.py
        start_line: 180
        end_line: 210
        blob: git-blob:4f7a8f9f7c29d9f26a1694ab7398d6b3914c9d56
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: 68951688ba8d813ab6707b1720cf80d1265bd8a8
    - id: SEC-003
      severity: low
      category: information_disclosure
      attack_scenario: '`log_invocation` writes each child''s full stdout and stderr at INFO. That output
        includes the model''s restatement of the study material and its tool inputs. Masking only removes
        registered verbatim material text and known secret shapes. Paraphrased or translated question
        and answer text, and any file contents a tool returned, pass through. Anyone who can read the
        stderr logs (terminal scrollback, CI logs, the redirected `NNN.stderr` files) can reconstruct
        copyrighted Udemy material, contrary to NFR-2.'
      code_anchors:
      - path: src/quiz_sift/safety/invocation_log.py
        start_line: 66
        end_line: 91
        blob: git-blob:a3d0a20305c2b9d2e5aba4e00290208cf6f1a2cd
      blocking: false
      status: open
      first_seen:
        trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
        subject_head_sha: 68951688ba8d813ab6707b1720cf80d1265bd8a8
    - id: SEC-004
      severity: low
      category: denial_of_service
      attack_scenario: On `TimeoutExpired`, `SubprocessRunner.run` kills only the direct child and then
        calls `proc.communicate()` with no timeout. If `claude` has spawned a grandchild that inherited
        the stdout/stderr pipes (a helper, or a subprocess started by a tool), that call blocks until
        the grandchild exits. The 10-minute per-call timeout therefore stops working, and the run hangs
        until the 12-hour `signal.alarm` fires, holding the minimal-home lock and blocking every other
        run.
      code_anchors:
      - path: src/quiz_sift/adapters/claude_process.py
        start_line: 58
        end_line: 69
        blob: git-blob:949d55dd0dd57e6366e367dacd842a86164b6a9d
      blocking: false
      status: open
      first_seen:
