- id: D-157
  subject: cli.main の外へ抜けた例外のトレースバックで、認証情報をどこで伏せるか
  reach: local
  status: settled
  settled_by: loop
  answer: cli.main が sys.excepthook を cli.py のモジュール関数(伏せるフック)に差し替える。フックは traceback.format_exception で原因の連鎖を含む全文を整形し、mask_secrets に通して、呼ばれた時点の sys.stderr へ書く。直前のフックは呼ばない。フックの中で例外が起きたら、例外の型名と「トレースバックを伏せた」旨だけを書き、例外を外へ出さない。例外そのものは捕まえずに main の外へ抜けさせる。差し替えは sys.excepthook がそのフックと同一でないときだけ行う。
  rationale: T-036 の受入テスト(C-015)は、例外が main の外へ抜けることと、sys.excepthook が出すテキストに平文が無いことを求める。main で捕まえて終了コードに変えると、全段の終了の仕方と _exit_code の対応が変わる。例外の args を書き換える方式では、__cause__ / __context__ の連鎖に載った値を伏せられない。直前のフックに渡すと、平文の例外オブジェクトが伏せる処理を経ずに渡る。出力先を差し替えた時点の stderr に束縛すると、閉じたストリームへの書き込みで落ちる。フックが例外を出すと、インタプリタが元のトレースバックを平文で出す(fail-open)。そのため、フックの失敗は型名だけの表示に落とし、外へ出さない。これは握りつぶしではなく、平文へ戻さないための fail-closed である(AR-160〜AR-164)。cli.py の1箇所に閉じ、claim の文面は動かない。
  requirement_ids:
  - NFR-3
