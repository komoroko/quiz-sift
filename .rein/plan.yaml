- id: D-160
  subject: 要約プロンプトで長さと形をどう縛るか
  reach: local
  status: settled
  settled_by: loop
  answer: SUMMARIZE_SYSTEM に、見出し・箇条書き・記号の装飾を使わない平文で、3文以内・200字以内に書くこと、専門用語は問題文に現れる表記のまま使い、問題文に無い専門用語や見出し語を作らないことを足す。スキーマに maxLength は足さない。人が選んだ選択肢の文面は「プロンプトとスキーマ」だったので、スキーマを外したことを mandate の提示で明示する(AR-172)。
  rationale: 実データでは Opus が見出しつきの 2507 字を返した。UI と音声で読む要約として長すぎ、照合する語句も増える。maxLength を足すと、--json-schema の下で超過がどう扱われるか(CLI 内での再試行か SCHEMA 失敗か)が未観測で、SCHEMA 失敗なら再試行しない規則(R-3)により列が止まる。プロンプトの変更は cluster 段の inputs_digest を動かし、キャッシュが1回無効になる(AR-21 の意図どおり)。
  requirement_ids:
