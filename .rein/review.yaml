  security:
    findings:
    - id: SEC-001
      severity: medium
      category: sandbox_escape
      attack_scenario: The `claude` child is fenced by a deny list (`DENIED_TOOLS` in `--settings permissions.deny`),
        not by an allow list. When a Claude Code update adds a tool that is not on that list, the tool
        is enabled. Quiz text scraped from Udemy result pages goes to the child on stdin. That text can
        carry a prompt injection telling the model to call the new tool, for example one that reads files
        under the minimal HOME, including `.credentials.json`, or makes network requests. `claude_failure._tool_problem`
        only sees the `init.tools` set and the `tool_use` blocks after the child has exited. By then the
        tool has already run and its output can be echoed into `structured_output`. Only that one call
        is marked as failed, so the tool runs anyway.
      code_anchors:
      - path: src/quiz_sift/adapters/llm_claude_cli.py
        start_line: 48
        end_line: 91
        blob: git-blob:694b83e522ccbb642322c25b4d7df73280e25032
