  - id: A-7
    statement: 'fake による1回の呼び出しで、記録用の meter に次の値が実際に届く: begin_invocation の現 argv のダイジェスト、end_invocation の model・num_turns・usage・total_cost_usd・result の is_error・skills_digest(init.skills から overhead.skills_digest で計算した値)、その子の rate_limit_event ごとの record_quota(順序どおり)。どれか1つを渡さない実装は赤になる。実物の success と success_opus を返す呼び出しで meter が受け取る model は、pipeline/meter.py の単価表のキー(claude-haiku-4-5 / claude-opus-5-5)と一致する(assistant イベントの日付付き ID を渡さない。AR-143)。argv のダイジェストはプロンプトとスキーマの本文を除いた argv から取る: プロンプトとスキーマだけが違う2つの呼び出し(classify と summarize)のダイジェストが等しく、モデルだけが違えば異なる(D-107、AR-144)。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
