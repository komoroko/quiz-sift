[project]
name = "quiz-sift"
version = "0.1.0"
description = "4択問題集を、耳だけでも効率的に学習できる形へ AI で変換する"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # LLM(ADR-002)。adapters 層からのみ import する。
    "anthropic>=0.75.0",
    # デッキ manifest(ADR-011)。mkdocs 経由の暗黙依存にしない。
    "pyyaml>=6.0.2",
    # 語句の実在性判定(ADR-010)。辞書は unidic ではなく unidic-lite(D-061)。
    "fugashi>=1.5.1",
    "unidic-lite>=1.0.8",
]

[tool.uv]
# アップロードから1週間以内の新しいバージョンはインストール対象から除外する。
# 公開直後のリリース(供給網リスク・初期不具合)を避けるためのクールダウン。
exclude-newer = "1 week"

[tool.ruff]
exclude = [".git", ".mypy_cache", ".venv", "third_party", ".worktrees", "site", ".rein"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.mypy]
strict = true
warn_unused_ignores = false
# src/ はまだ存在しない(guard.paths のため mandate 承認後に作る)。パスを列挙すると
# 不在で落ちるので、除外側で絞る。
exclude = ["^site/", "^\\.rein/", "^\\.venv/", "^\\.worktrees/"]
# tests/ から import した製品コードの型が Any に落ちないようにする(AR-23)。
mypy_path = ["src"]
# ignore_missing_imports を全体既定にすると strict が広い範囲で空振りする(AR-23)。
# 型スタブを持たないサードパーティにだけ、override で限定して許す。
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["fugashi.*", "unidic_lite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# テストは tests/ に置く。src/ は .rein/config.yaml の guard.paths に含まれ、mandate が
# 承認されるまで書き込めない。PyProjectTemplate は src/ にテストを同居させるが、
# Loose Rein のガード規則が優先する。
testpaths = ["tests"]
# src レイアウトのまま、インストールせずに import できるようにする。
# 品質ゲートは worktree をそのまま /work にマウントして走るため、ここに頼る。
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
