      - tests/fixtures/claude_cli/success.meta.yaml
      - tests/fixtures/claude_cli/success_opus.stdout
      - tests/fixtures/claude_cli/success_opus.meta.yaml
      - tests/fixtures/claude_cli/invalid_schema.stdout
      - tests/fixtures/claude_cli/invalid_schema.meta.yaml
