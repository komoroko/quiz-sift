  subject: T-021 の受入基準 A-2 が要求するスクリーンショットをどの scope のどのパスに置くか
  reach: mandate
  status: settled
  settled_by: human
  answer: T-021 の scope.include に docs/test/measurements/ui-e2e/ を足し、PNG をそこへコミットする。当初 out/ui-e2e/ に置いたが、これは T-021 自身(kind が integration で、リポジトリルートで走る)でしか緑にならない。parallel タスクは git worktree add の追跡ファイルだけのチェックアウトで走るので out/ が存在せず、DoD の test ステップ(pytest -q で全スイート)が tests/measurements/test_host_check_logs.py::test_ui_e2e_passed_and_screenshots_exist で以降の全タスク分赤くなる。T-018 が実際にこれで blocked になった。品質プロファイルが worktree を bind マウントするため gitignore 対象もサンドボックスから見えること自体は実測で確かめてあるが、見えるかどうかはそのタスクがどの木で走るかに依存し、判定の緑が環境に依存するのは証拠として弱い。判定方法も基準の文言も変えず、抜けていた1パスを足すだけに留める。同じ形の欠落は D-079(T-007 の pre-commit.md)に続いて2件目。
