  subject: 製品の経路に無い adapters/llm_anthropic.py
  reach: mandate
  status: settled
  settled_by: human
  answer: 削除し、使われなくなった依存 anthropic も外す。NFR-8 (a) のテストは削除後の状態に合わせて直す。
  requirement_ids:
