        findings:
        - severity: must_fix
          statement: A-2 と A-4 のテストは呼び出し回数を、基準が名指す「3 回」ではなくモジュールの定数 `1 + MAX_REGENERATIONS` と比べている。そのため上限がずれても赤にならない。A-2
            は src/quiz_sift/cluster/summary.py の MAX_REGENERATIONS を 5 に変えると 4 つのパラメータすべてが緑のまま(混ざった落ち方でも、最後の生成が同じ検査に落ち続けるので期待する例外になる)。A-4
            は MAX_REGENERATIONS を 1 にしても 5 にしても緑のまま。上限を固定しているのは A-1・A-3 だけで、各基準の判定コマンドは単独で回る。チケットの試験方針も「2
            回落ちてから通る」と「3 回落ちる」の両方で上限を固定すること(どちらか一方だけでは 1 でも 5 でも緑になる)と書いている。期待値は 3 を直接書くべきである。
          anchor: tests/cluster/test_summary.py:338
        - severity: must_fix
          statement: A-4 も同じ穴を持つ。`llm.described.count(TARGET) == 1 + MAX_REGENERATIONS` と、判定した回数の `==
            1 + MAX_REGENERATIONS` は、src/quiz_sift/glossary/verify.py の MAX_REGENERATIONS が何であっても成り立つ。基準どおり
            3 で固定すべきである。
          anchor: tests/glossary/test_verify.py:461
        - severity: must_fix
          statement: A-5 とチケットは、作り直しのログに検査名(なぜ作り直したか)を載せることを求めている。ところが cluster 段の実在性による作り直しで出る `grounding`
            はどのテストも確かめていない。A-5 は含意判定の作り直しだけを起こし、`entailment` を正規表現で見ている。そのため summary.py:59 の check の振り分けを
            `check = "entailment"` に固定しても、全テストが緑のままになる。cluster 段で実在性による作り直しを起こし、ログが `(grounding; 1 回目)`
            になることを確かめるテストが要る。
          anchor: src/quiz_sift/cluster/summary.py:59
