- id: D-161
  subject: R-3 の要約で「専門用語」をどう切り出すか(D-159 の定義)
  reach: local
  status: settled
  settled_by: loop
  answer: 名詞句ではなく、要約の本文から断片を直接切り出す。日本語デッキは、英字で始まる英数字の語(Lambda、S3、EC2)と、カタカナが2字以上続く列(ストレージクラス)。英語デッキは、大文字略語(S3、IAM)と、文頭以外にある大文字始まりの語(Lambda、Aurora)。漢字とカタカナが混ざった名詞句(判断ポイント)は、カタカナの列(ポイント)だけを照合する。断片ごとに、そのクラスタの問題の本文(問題文・選択肢・解説)に実在するかを grounding.presence.is_present で確かめる。専門用語が0件の要約は照合を通り、残る守りは含意判定だけになる(AR-167)。この判定は cluster/summary.py に置き、glossary の抽出器(R-5 の抽出精度のための定義)には依存させない。
  rationale: 'glossary の terms_in を流用すると、名詞句全体を照合するので実際に止まった「判断ポイント」がそのまま止まり(AR-165)、英語では大文字略語しか見ないので本文に無い Lambda が素通りする(AR-166)。R-5 の抽出精度の都合で R-3 の安全検査が黙って変わる結合も生む(AR-169)。「1語以上の専門用語を必須にする」は、漢字だけで書かれる正当な論点(最小権限の原則)を止めるので採らない。本文に無いカタカナの一般語(ポイント)は引き続き止まる。これはプロンプト(D-160)で抑える。'
  requirement_ids:
  - R-3

