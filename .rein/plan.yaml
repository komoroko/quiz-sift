- id: T-044
  title: 既定 LLM の切り替え(composition と入口、SDK 経路の撤去)
  kind: integration
  blocked_by:
  - T-032
  - T-033
  - T-034
  - T-035
  - T-036
  - T-043
  claim_ids:
