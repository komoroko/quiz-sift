    statement: 実パーサが、T-041 の実物フィクスチャ3件を、meta の exit_code と stderr を付けたまま判定器へ渡して読む。success と success_opus は割当を返し、invalid_schema は PARSE に落ちる。これとは別に、tests/support/claude_fake.py のファクトリが error_max_turns 形を作る。成功フィクスチャの骨格から subtype / is_error / stop_reason / structured_output の値だけを置き換え、キーは消さない。この形は TRUNCATED に落ち、その骨格は差し替えた4キー以外で成功フィクスチャと同一である(D-118)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/adapters/test_claude_contract.py::test_real_fixtures_parse_to_the_expected_kinds
      executor_profile: quality
  - id: A-6
    statement: fake の出力は、tests/support/claude_fake.py の単一のファクトリだけが作る。判定には T-042 の assert_no_inline_stream_json(tests_root) を使う。result イベントを持つすべての形(成功、TRUNCATED、PROVIDER_ERROR、SCHEMA、INCOMPLETE_IDS、overage、rejected)の出力は、キー骨格が成功フィクスチャと同一である。result を持たない PARSE 形は対象外。usage.cache_read_input_tokens を落とした fake に対して、この骨格判定は赤になる(negative control)。ファクトリは、PATH に置ける実行ファイルとしての入口も提供する。この入口は stdin のプロンプトから問題キーを読み、同じ多重集合を返す。
