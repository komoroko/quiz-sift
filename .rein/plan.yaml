  status: settled
  settled_by: human
  answer: '既知の赤として rein baseline measure --freeze で凍結する。smoke は CLI の入口を叩くが、CLI は src/ に住み、src/ は guard.paths にあるので承認まで書けない。config.yaml は承認で凍結されるため『承認前に緑にする』ことが原理的にできない順序になっている。required: false なので DoD はブロックしない(AR-20)。'
  requirement_ids:
  - NFR-5
- id: D-067
  subject: R-2 の selector_kind をどう決めるか
  reach: local
  status: settled
  settled_by: loop
  answer: 実行時にどの抽出規則が実際にマッチしたかから導出し、フォールバック枝ごとに別の値を返す。定数にすると『全問で同一種別』の判定が恒真式になる。加えて、集合サイズが 2 になって赤くなる negative control フィクスチャを置く。
  rationale: 抽出器の内部実装。claim の文面(根拠が目視で追跡できる)も受入基準の文言も動かないが、判定が恒真式かどうかという意味では証拠能力そのものなので、negative control とセットで初めて local と言える。
  requirement_ids:
  - R-2
- id: D-068
  subject: 出題のシャッフル seed の導出元
  reach: local
  status: settled
  settled_by: loop
  answer: セッション ID × 問題 ID。問題 ID だけだと同じ問題がいつ出題しても同じ順列になり、事前で位置を覚えた人が事後でも当てられる。同一問題の2セッションで presentation が異なることを機械判定する。
  rationale: seed の導出は scoring/session.py 1ファイル。受入基準の文言(事後テストではシャッフルされる)は動かず、その目的を満たす形に直しただけ。
  requirement_ids:
  - R-8
- id: D-069
  subject: ports/browser.py と LLM レスポンスキャッシュを置くか
  reach: local
  status: settled
  settled_by: loop
  answer: どちらも置かない。抽出器を HTML 文字列の純粋関数にした時点でテスト容易性は得られており、D-008 が挙げるのは LLM・TTS・音声認識でブラウザは入っていない。LLM レスポンスキャッシュはどの要件も強制しておらず、置くと R-3 の『2回の実行で API 呼び出しが2倍』基準がそれを検出するために存在することになる。
  rationale: どちらも足す方向なら後からできる。落とすことで壊れる受入基準は無い。
  requirement_ids:
  - R-2
  - R-3
  - NFR-4
- id: D-070
  subject: inputs_digest の構成要素
  reach: local
  status: settled
  settled_by: loop
  answer: 前段成果物の内容 + プロンプトテンプレートの digest + モデル ID + 生成パラメータ。ステージ実装コード自体は入れない。前者が欠けるとプロンプトを直しても旧成果物がキャッシュヒットで返り、後者を入れると無関係な編集で全ステージが再実行されてコストが毎回乗る。
  rationale: pipeline/stage.py の digest 関数。NFR-4 の受入基準(前段の呼び出し0)は動かない。
  requirement_ids:
  - NFR-4
- id: D-071
  subject: 学習記録へのアクセス経路
  reach: local
  status: settled
  settled_by: loop
  answer: DeckScopedStore(deck_id) 経由に限定し、生の接続を store/location.py の外に出さない。deck_id 列だけだと WHERE を1本書き忘れた集計クエリが型検査にも mypy strict にも引っかからず、2デッキ分を合算する。
  rationale: store/ の内部設計。R-11 の受入基準(記録がセット単位で分離される)の文言は動かず、それを構造で保証する形にしただけ。
  requirement_ids:
  - R-11
  - R-8
  - R-10
- id: D-072
  subject: Web UI と API のオリジンとサーバのスレッドモデル
  reach: local
  status: settled
  settled_by: loop
  answer: Next.js の rewrites で同一オリジンに寄せ、ThreadingHTTPServer を使い、SQLite の接続はリクエストごとに開いて閉じる。out/ の配信は読み取り専用エンドポイント1本。BaseHTTPRequestHandler は preflight の OPTIONS に 501 を返すので、そのままでは回答の送信が失敗する。
  rationale: server/ の内部設計。R-12 の受入基準の文言は動かない。
  requirement_ids:
  - R-12
- id: D-073
  subject: R-10 の復習用再生リストと R-7 の連番の共存
  reach: local
  status: settled
  settled_by: loop
  answer: out/<deck>/review/ の別系列へ複製(可能ならハードリンク)して誤答率順の連番を振る。out/<deck>/audio/ の改名は R-7 の『ファイル名昇順で意図した順に並ぶ』を壊す。グロッサリが D-049 で採っているのと同じ形。
  rationale: 出力レイアウトの選択。両方の受入基準が同時に成立する形を選んだだけで、文言は動かない。
  requirement_ids:
  - R-10
  - R-7
- id: D-074
  subject: サンドボックスイメージへ依存を焼く手段
  reach: local
  status: settled
  settled_by: loop
  answer: uv.lock から uv export で導出した requirements.txt を .rein/oci/quiz-sift/ に置き、Containerfile はそれを COPY して uv pip install する。lock を直接 COPY できないのは rein oci build のビルドコンテキストが Containerfile のディレクトリだから。派生物が lock と一致していることを tests/test_gate_environment.py が検査する。
  rationale: ビルド手段の選択。ADR-001 の決定(依存をイメージに焼く)は動かず、その実現方法を1つに決めただけ。一致検査があるので、手で編集された版が黙って焼かれることはない。
  requirement_ids:
  - NFR-6
  - NFR-5
