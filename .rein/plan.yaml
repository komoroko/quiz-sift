  answer: '段のサブコマンドに --fresh-run(新しい run_id、段キャッシュを迂回)と --resume RUN_ID(既存の列に実行を足す。開始行の無い run_id は即エラー終了)を足す。無指定は通常のキャッシュを使う1実行だけの列(cache_mode: normal)で、フル処理の列には数えない。R-3 のキャッシュ迂回2回は --fresh-run を2回で行う。'
  rationale: フラグ名と既定は cli.py の中に閉じる。無指定を迂回にしないのは NFR-4 の「前段の呼び出し 0」を壊さないためで、claim は動かない。
  requirement_ids:
  - R-3
  - NFR-4
  - NFR-7
- id: D-137
  subject: 初回の段キャッシュ迂回をどう実現するか
  reach: local
  status: settled
  settled_by: loop
  answer: --fresh-run / --resume の実行は inputs_digest の構成要素に run_id を加える。列ごとに成果物の名前が分かれ、その列が作った成果物(実行中に作ったものを含む)にだけヒットし、他の列や列より前の成果物にはヒットせず、別の列に上書きされない。キャッシュの削除はしない。通常の実行の digest は変えない。(AR-125・AR-131 で「run 単位のヒット許可」から改訂)
  rationale: StageCache の引数1つと終了行の1フィールドに閉じる。削除案は教材本文を CLI のセッション記録にもう一度平文で残す(D-086)ので採らない。戻すのは1タスク。
  requirement_ids:
  - NFR-4
  - NFR-7
- id: D-138
  subject: 1実行 12 時間の上限の掛け方
  reach: local
  status: settled
  settled_by: loop
  answer: cli.main で signal.alarm を掛け、期限でハンドラが SystemExit の派生を上げる。subprocess.run は子を kill してから上げ直し、finally が終了行を書く。外部の timeout コマンドは終了行が書かれないので使わない。
  rationale: cli.py の入口数行に閉じ、claim は「1実行 12 時間」を課すだけで掛け方を定めない。協調チェックへの差し替えは1タスク。
  requirement_ids:
  - R-3
  - NFR-7
- id: D-139
  subject: 列の集約をどこに記録するか
  reach: local
  status: settled
  settled_by: loop
  answer: 各実行の終了行に sequence オブジェクトとして、その時点までの列の集約を書く。最後の実行の終了行が最終値になる。新しいサブコマンドは作らない(NFR-8 (d) の入口集合を変えない)。
  rationale: meter.jsonl の1フィールドに閉じ、要件の「実行ごとと列の合算値を記録」をどちらの案も満たす。
  requirement_ids:
  - NFR-7
- id: D-140
  subject: 起動できなかった子(SPAWN)を rate_limit_event が届かなかった呼び出しに数えるか
  reach: local
  status: settled
  settled_by: loop
  answer: 数える。要件の字義(呼び出しごと)に従い、SPAWN・TIMEOUT・PARSE の子も含める。SPAWN があれば (h) は unknown になるが、その列はどちらにしても完走不可。
  rationale: unknown に倒れる側で、passed を過大に主張しない。計数の条件1つで戻せる。
  requirement_ids:
  - NFR-8
- id: D-141
  subject: skills 一覧ダイジェストの正規形
  reach: local
  status: settled
  settled_by: loop
  answer: init イベントの skills の名前を並べ替えた JSON 配列の sha256。キーが無いときは固定値 "absent" のダイジェスト。名前が同じまま説明文が変わる同期は検知できないことを Risks に書く。
  rationale: overhead.py と Meter の比較1箇所に閉じ、D-126 の「違えば unknown」の意味は変わらない。
  requirement_ids:
  - NFR-7
- id: D-142
  subject: R-3 の再現性測定(キャッシュ迂回2回)に使う列
  reach: local
  status: settled
  settled_by: loop
  answer: --fresh-run cluster の1実行だけで exit 0 まで走った列を2本使う。再開した列は使わず、枠で止まったら新しい --fresh-run で取り直す。
  rationale: 測定手順の選び方で C-003 の文面は動かない。再開した列を除くのは「1回分の2倍」を比較可能にするためで、証拠を緩めない側。
  requirement_ids:
  - R-3
- id: D-143
  subject: 起動前検査を掛けるサブコマンドとゲート内の差し替え口
  reach: local
  status: settled
  settled_by: loop
  answer: LLM を呼びうる段(cluster / recall / glossary / script / audio)だけに掛け、ingest / review / serve には掛けない(D-115)。cli.main は preflight=default_preflight を既定値に持ち、ゲート内の cli テストは llm_factory と同じく fake を渡す。既定値が本物であることと入口が main(argv) だけを呼ぶことを signature と AST で判定する。
  rationale: cli.py の引数1つと判定テストに閉じる。検査そのものは Workspace を直接走らせるテストが判定するので C-020 の証拠は動かない。
  requirement_ids:
  - NFR-8
- id: D-144
  subject: overage または rejected を観測した後の、同じ段の残りの呼び出し
  reach: local
  status: settled
  settled_by: loop
  answer: 発行しない。集計して非 0 終了する。それ以外の失敗種別は現行どおり段の呼び出しを終えてから止める。
  rationale: 止める時点を早めるだけで、非 0 終了・失敗件数と実際の失敗数の一致・列の完走判定は変わらない。段の呼び出しループ1箇所に閉じる。
  requirement_ids:
  - R-3
  - NFR-8
- id: D-145
  subject: 列の status の定義(completed / resumable / not_completable)と --resume の条件
  reach: local
  status: settled
  settled_by: loop
  answer: completed は not_completable でなく最後の実行の stage が audio で exit 0。途中の実行は exit 0 かレート枠による停止のどちらか。resumable はそのどちらでもないもの。--resume は resumable の列にだけ許す。JSON として読めない行は、列の最初の開始行より後ろにあればその列を not_completable にする。
  rationale: 要件の「完走は最後の実行が exit 0」「途中の非0終了はレート枠によるものだけ」をフル処理(最終段まで)として読んだもので、完走と数える列を狭める側。集約関数1つに閉じる。
  requirement_ids:
  - NFR-7
