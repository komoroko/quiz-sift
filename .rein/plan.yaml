- id: D-217
  subject: 想起素材の上限超過の止め方
  reach: local
  status: settled
  settled_by: loop
  answer: 全問を回し切ってから、上限を超えた問題をすべて列挙して止まる(最初の超過で即座には止めない)。
  rationale: 1試行で分かる不合格を最大にし、試行予算を守るため(AR-D10)。recall のループ1か所の制御で、C-004 の「上限を超えた問題があれば成果物を出さずに非0終了」は変わらない。
  requirement_ids:
  - R-4
  - NFR-7
- id: D-218
  subject: リハーサルからのレート枠の外挿
  reach: local
  status: settled
  settled_by: loop
  answer: utilization の差分は小数2桁に量子化されるので使わず、呼び出し数とトークン数の実測を 190 問に外挿し、前サイクルの列の utilization とトークン数の比から枠の使用率を推定する。utilization
    の生の値も併記する。
  rationale: 記録の整形の方法だけで、C-026 の「使用率が記録される」は変わらない。
  requirement_ids:
  - NFR-7
  - R-4
- id: D-219
  subject: 想起素材の report の検査ごとの延べ件数(attempt_failures)
  reach: local
  status: settled
  settled_by: loop
  answer: 作らない。問題ごとの再生成回数だけを記録する。
  rationale: どの要件も求めていない(AR-D14、YAGNI)。後で要れば recall の report に1項目足すだけ。
  requirement_ids:
  - R-4
- id: D-220
  subject: フル処理の記録の整形(render)を誰が走らせるか
  reach: local
  status: settled
  settled_by: loop
  answer: 人がホストで exec と同じ作業ルートに対して render も走らせ、件数だけの記録を渡す。ループは out/ を読まず、記録の判定だけを行う。
  rationale: ループが教材の置かれた out/ を読まないため(AR-D15、NFR-2)。測定の道具の手順だけで、C-025 は動かない。
  requirement_ids:
  - NFR-7
  - NFR-2
- id: D-221
  subject: 親が SIGHUP/SIGTERM で終わるときの子
  reach: local
  status: settled
  settled_by: loop
  answer: 親でシグナルを受けて子のプロセスグループに killpg してから終わる。
  rationale: start_new_session で子が端末のグループから外れ、親だけが死ぬと子が残り、すぐの --resume で2本の claude が同じ最小ホームを使う(AR-D16)。起動点のタスク1つで閉じる。
  requirement_ids:
  - R-3
  - NFR-8
- id: D-222
  subject: ストア v2 の作成
  reach: local
  status: settled
  settled_by: loop
  answer: テーブルの作成と PRAGMA user_version = 2 を1つのトランザクションで行う。
  rationale: 途中のクラッシュや同時の初回接続で「テーブルあり・版 0」に見えて旧形式と誤判定されるのを防ぐ(AR-D18)。store の関数1つ。
  requirement_ids:
  - R-8
