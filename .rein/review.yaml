        statement_id: AST-003
        statement: The tool check fails the call in two cases. The first is when no system/init event
          exists or any init.tools differs from the set {'StructuredOutput'} (compared as sets). The second
          is when an assistant message has a content block whose type ends in 'tool_use' and whose name
          is outside that set.
        confidence: high
        paths:
        - src/quiz_sift/adapters/claude_failure.py
      - category: default_value
        statement_id: AST-005
        statement: child_env sets HOME to home_root (by default ~/.quiz-sift-claude-home) and copies PATH
          from os.environ['PATH'], which raises KeyError if PATH is unset. LANG falls back to C.UTF-8
          and TZ to Asia/Tokyo when unset or empty.
        confidence: high
        paths:
        - src/quiz_sift/adapters/claude_process.py
      - category: security_boundary
        statement_id: AST-009
        statement: build_argv produces the command `claude -p --output-format stream-json --verbose --max-turns
          3`. It passes the JSON schema, model and system prompt as argv values. It also passes an empty
          strict MCP config, a --settings value that denies a hard-coded list of 42 tool names, `--permission-mode
          default` and `--safe-mode`. The payload itself is sent as JSON on stdin.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
      - category: observability
        statement_id: AST-010
        statement: argv_digest replaces the values that follow --json-schema and --system-prompt with
          '<omitted>', then takes the sha256 of the compact JSON of the argv. The model and all other
          flags stay in the digest.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
      - category: security_boundary
        statement_id: AST-014
        statement: Only classify_clusters, summarize_cluster and generate_recall register question texts
          with the MaterialTextFilter. describe_term and check_entailment register nothing, so the term,
          reference and statement they send are not added to the log's masking set.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
      - category: security_boundary
        statement_id: AST-015
        statement: record_invocation stores stdin only as a sha256 and a byte length. It stores the argv
          (including the system prompt and schema values) and the stdout/stderr, all passed through MaterialTextFilter.mask
          and then mask_secrets. Undecodable bytes are written with backslashreplace. log_invocation emits
          the record as JSON at INFO level.
        confidence: high
        paths:
        - src/quiz_sift/safety/invocation_log.py
      - category: dependency
        statement_id: AST-019
        statement: The default Llm for the CLI is composition.build_default_llm, which always returns
          ClaudeCliLlm(meter). The default preflight is claude_process.default_preflight.
        confidence: high
        paths:
        - src/quiz_sift/cli.py
        - src/quiz_sift/composition.py
      - category: public_interface
        statement_id: AST-020
        statement: AnthropicLlm now builds anthropic.Anthropic() inside its own constructor and takes
          only a meter. It picks the model per method from llm_prompts.MODELS and records usage with meter.record.
          It never calls begin_invocation or end_invocation. Classification contract errors, including
          INCOMPLETE_IDS, turn the whole batch into a CallFailure.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_anthropic.py
      - category: observability
        statement_id: AST-025
        statement: _run catches every BaseException to derive exit_code and exit_reason (the exception
          class name), then re-raises. In the finally block it calls meter.finish(exit_code, exit_reason)
          whenever a meter exists. _exit_code maps non-SystemExit exceptions to 1, code None to 0, integer
          codes to themselves and any other code to 1.
        confidence: high
        paths:
        - src/quiz_sift/cli.py
      - category: security_boundary
        statement_id: AST-026
        statement: main() replaces sys.excepthook with _masked_excepthook for the whole process and never
          restores it. The hook writes the traceback to stderr after passing it through mask_secrets.
          If masking raises an Exception, it writes only the exception type name.
        confidence: high
        paths:
        - src/quiz_sift/cli.py
      - category: persistence
        statement_id: AST-029
        statement: The Meter constructor rejects any cache_mode outside fresh, resume and normal. It appends
          a start line with run_id, execution_id, started_at, cache_mode, stage, the sorted names of all
          environment variables, and the subset that falls in METERED_ENV_NAMES. Only names are written,
          never values.
        confidence: high
        paths:
        - src/quiz_sift/pipeline/meter.py
      - category: persistence
        statement_id: AST-032
        statement: finish() raises on a second call. It builds an end line containing a stop entry (exit_code,
          exit_reason, kind; kind is completed when exit_code is 0, rate_limit when ended_by_rate_limit
          is true, otherwise other) and an overage_check (failed/unknown/passed). It appends to the line
          a 'sequence' field, computed by aggregate over the existing log plus the new line. If aggregate
          raises, the end line is never written.
        confidence: high
        paths:
        - src/quiz_sift/pipeline/meter.py
      - category: persistence
        statement_id: AST-033
        statement: _append opens the log in a+b mode and writes each line with a single write call, then
          flushes and fsyncs. If the file does not end in a newline, it writes a newline first.
        confidence: high
        paths:
        - src/quiz_sift/pipeline/meter.py
      - category: security_boundary
        statement_id: AST-037
        statement: The summary grounding check no longer uses extract_terms. It NFKC-normalizes the summary
          before extracting terms. For JA decks it takes alphanumeric words containing letters and katakana
          runs of two or more characters. For EN decks it takes all-caps acronyms and capitalized words
          that are not at the start of a sentence. Kanji-only words, hiragana and lowercase words are
          not checked, and a summary that yields no terms passes.
        confidence: high
        paths:
        - src/quiz_sift/cluster/summary.py
      - category: security_boundary
        statement_id: AST-038
        statement: mask_secrets now also replaces any run of characters (excluding whitespace, quotes,
          '=' and ':') that ends in '.credentials.json' with '***'. sk-ant- tokens, including OAuth ones,
          were already masked by the existing pattern.
        confidence: high
        paths:
        - src/quiz_sift/safety/secret_mask.py
