          back to 'C.UTF-8' and TZ to 'Asia/Tokyo' when they are absent or empty.
        confidence: high
        paths:
        - src/quiz_sift/adapters/claude_process.py
      - category: security_boundary
        statement_id: AST-010
        statement: 'build_argv produces a fixed `claude -p` argv with these flags: stream-json output,
          --verbose, --max-turns 3, the JSON schema, the model, the system prompt, --exclude-dynamic-system-prompt-sections,
          --strict-mcp-config with an empty mcpServers config, --settings denying a hard-coded list of
          42 tool names, --permission-mode default, and --safe-mode. The payload is not in argv.'
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
      - category: observability
        statement_id: AST-011
        statement: argv_digest replaces only the values that follow --json-schema and --system-prompt
          with '<omitted>', then takes sha256 of the compact JSON of the argv. The model and all other
          flags stay in the digest.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
      - category: default_value
        statement_id: AST-014
        statement: The spawned CommandSpec never sets timeout_sec, so every child uses DEFAULT_TIMEOUT_SEC
          = 600 seconds.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
        - src/quiz_sift/ports/process.py
      - category: security_boundary
        statement_id: AST-016
        statement: Only classify_clusters, summarize_cluster and generate_recall register questions with
          the adapter's own MaterialTextFilter. describe_term and check_entailment register nothing, so
          their stdout/stderr masking relies only on questions registered by earlier calls on the same
          instance.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_claude_cli.py
      - category: public_interface
        statement_id: AST-020
        statement: AnthropicLlm now builds anthropic.Anthropic() in its constructor and picks the model
          per method from llm_prompts.MODELS. It records usage with meter.record only and never calls
          begin_invocation, end_invocation or record_quota. Its classify path uses parse_proposals, so
          a batch with missing or extra ids now becomes a CallFailure for the whole batch where unknown
          keys used to be dropped.
        confidence: high
        paths:
        - src/quiz_sift/adapters/llm_anthropic.py
      - category: dependency
        statement_id: AST-022
        statement: build_default_llm always returns ClaudeCliLlm(meter). cli.main defaults llm_factory
          to it and preflight to claude_process.default_preflight.
        confidence: high
        paths:
        - src/quiz_sift/cli.py
        - src/quiz_sift/composition.py
      - category: persistence
        statement_id: AST-031
        statement: Meter's constructor validates cache_mode and appends a 'start' JSON line. _append writes
          each line in one write, prefixing a newline if the file does not end with one, and then flushes
          and fsyncs.
        confidence: high
        paths:
        - src/quiz_sift/pipeline/meter.py
      - category: persistence
        statement_id: AST-036
        statement: read_log turns every line that is not a UTF-8 JSON object into None. It splits with
          bytes.splitlines, so \r also splits lines.
        confidence: high
        paths:
        - src/quiz_sift/pipeline/run_sequence.py
      - category: security_boundary
        statement_id: AST-040
        statement: The grounding check in cluster summaries now uses _technical_terms instead of extract_terms,
          applied after NFKC-normalising the summary. Japanese decks check only alphanumeric words that
          contain a letter and katakana runs of two or more characters. English decks check only all-caps
          acronyms and capitalised words that are not at sentence start. Kanji, hiragana, lowercase words
          and sentence-initial capitalised words are never checked.
        confidence: high
        paths:
        - src/quiz_sift/cluster/summary.py
      - category: security_boundary
        statement_id: AST-041
        statement: mask_secrets gains a pattern that replaces any run of non-space, non-quote, non-'='
          and non-':' characters ending in '.credentials.json' with '***'. The existing sk-ant- pattern
          also covers OAuth tokens.
        confidence: high
        paths:
        - src/quiz_sift/safety/secret_mask.py
