cycle:
  id: quiz-sift
  base_commit: 63281415498b8f703641edd66b18e2013e1f5bc2
  branch: build/quiz-sift
scope:
  include:
  - src/
  - web/
  - pyproject.toml
  - uv.lock
  - tests/
  - docs/
  exclude:
  - docs/archive/
  - gate.sh
  - .github/
claims:
- id: C-001
  requirement_ids:
  - R-1
  statement: 選択肢 M 件・正解 N 件(M ∈ {4,5,6}、1 ≤ N < M)の問題を取り込むと、問題文・選択肢 M 件・正解 N 件が欠落なく保持され、範囲内の 12 組すべてを含む正常系フィクスチャで除外件数が
    0 になり、範囲外の (N, M)・正解の配列が空か重複か未知 ID を含むもの・ID 重複は問題ごとに列挙されて除外件数が報告され、正解を単一の値で持つ入力は拒否される。
  risk: high
- id: C-002
  requirement_ids:
  - R-2
  statement: 正解のマークが N 件ある問題が N 件の正解として抽出され、選択肢5件・6件の問題ブロックが抽出の失敗にならず(3件以下・7件以上は失敗として列挙され)、受験者の選択から正解を推定する経路はページの印で単一選択と判別できた問題でだけ使われ、人手で確認した
    N-of-M を3件以上加えたゴールデンセット全体で正解の集合の一致率が 100% であり、保存済みの生 HTML の再抽出(届かなければ人の取り直し)の報告に全問数と (N, M) の組ごとの件数が現れる。
  risk: high
- id: C-021
  requirement_ids:
  - R-3
  statement: 子プロセスの子が stdout と stderr の pipe を持ち続けても、呼び出し1回のタイムアウトを超えるとプロセスグループごと終了し、タイムアウトから 10 秒以内に
    TIMEOUT として返る。孫が新しいセッションに抜けていても 10 秒以内に戻る。修正前のコードではこの受入テストが赤になる。
  risk: medium
- id: C-004
  requirement_ids:
  - R-4
  statement: 想起素材は問題ごとに生成され、想起キーの各語・状況・条件はその問題の問題文に G-1 の意味で実在し、想起キー・他クラスタ出現率・クラスタ要約の検査は G-1 を実装した単一の述語を呼び、生成プロンプトの照合先は検査と同じ定数から組み立てられ、識別ポイントは構造化した選択肢
    ID で1件以上の誤答選択肢だけを参照し、答えは要素ごとに選択肢 ID を持ち ID の集合が正解の集合と一致する N 要素の配列であり、重複キーはクラスタをまたぐ場合だけ数えられ、1問単位の検査かクラスタをまたぐ重複に落ちた問題だけが上限
    2 回まで再生成されて回数が記録され、上限を超えた問題があれば成果物を出さずに非 0 終了する。
  risk: high
- id: C-026
  requirement_ids:
  - R-4
  statement: 日本語と英語と複数正解問題を含む合成デッキを実 CLI で recall 段まで通すと、recall 段が exit 0 で終わり、想起素材の検査のすべての件数が 0 で含意判定が通り、問題ごとの再生成回数とレート枠の使用率が記録される(ホストでの実測)。
  risk: high
- id: C-006
  requirement_ids:
  - R-6
  statement: 台本は、記号 A〜F・番号 1〜6・かな ア〜カのいずれでも、同じ系列の先頭から M 件(M はそのトラックに含まれる問題の M の最小値)のラベルがすべて揃う形を含まず、N-of-M
    の問題では答えの部分が正解 N 件すべてに言及し、要素の欠けた台本は出力されない。
  risk: medium
- id: C-007
  requirement_ids:
  - R-7
  statement: フル処理の前に、合成した短い台本1本(文と間を含む)が製品の audio 段と同じ経路で実 CosyVoice(torch 2.10)により合成され無音判定が真になることがホストで確かめられ、フル処理の列で生成した全クラスタの音声について、先頭と末尾を除く位置に前後を有音区間に挟まれた3秒以上の無音区間があることが機械判定で真になる。
  risk: high
- id: C-008
  requirement_ids:
  - R-8
  statement: 問題ごとに選んだ選択肢の集合・正誤・所要時間が永続記録され、選んだ集合が正解の集合と完全に一致したときだけ正答となり、API は N 件以外の回答を 400 で拒否し、N-of-M
    を含むシャッフル提示のフィクスチャで全問正解の入力が 100%、正解1件を誤答1件に入れ替えた全問誤答の入力が 0% になり、同じ所在に旧形式の学習記録ストアを見つけるとエラーで止まる。
  risk: high
- id: C-012
  requirement_ids:
  - R-12
  statement: Web UI は N-of-M の問題を複数選択で出題して「N 個選択」を表示し、選択がちょうど N 件のときだけ回答を送れる。
  risk: medium
- id: C-013
  requirement_ids:
  - NFR-1
  statement: 想起素材・台本・クラスタ要約の含意判定の reference が正解 N 件すべてを含み(識別ポイントは参照先の誤答選択肢の本文も含み)、N 要素の答えは要素が持つ選択肢 ID
    の正解と判定され、N 件のうち1件とだけ矛盾する生成物や参照先の誤答と矛盾する識別ポイントでは成果物を出さずにエラー終了し、正解を言い換えただけの生成物では誤検出しない。
  risk: critical
- id: C-014
  requirement_ids:
  - NFR-2
  statement: 子プロセスの stdout と stderr の本文とその断片が、成功と各失敗経路(SCHEMA・PARSE・TIMEOUT・未知の判定語)のどれでも、stderr とすべてのレベルのログ(例外のメッセージ経由を含む)に
    0 件であり、子の呼び出しの記録には argv・終了コード・所要時間・4値トークン・失敗種別・レート枠・stdin のダイジェスト・init.tools・isUsingOverage が残る。
  risk: critical
- id: C-022
  requirement_ids:
  - NFR-5
  statement: pyproject.toml の version、quiz_sift.__version__、uv.lock の quiz-sift の項目、--version の出力の4か所が
    0.1.1 で一致し、src・tests・pyproject.toml と uv.lock の quiz-sift の項目に quiz-sift のバージョンとしての 0.1.0 が残らない。
  risk: low
- id: C-019
  requirement_ids:
  - NFR-7
  statement: NFR-8 の実測で確定した argv で、既知長の合成プロンプト k = 1, 2, 3 の3点から固定オーバーヘッドが取り直され、入力トークンの差が材料の差と一致し、切片が記録した定数と一致し、記録に使った
    argv が残る(ホストでの実測)。
  risk: medium
- id: C-025
  requirement_ids:
  - NFR-7
  - R-3
  - NFR-8
  statement: R-2 で得た実デッキ(期待 190 問)で、人がホストで走らせた cluster から audio までの1列が completed になり、予算の外の再現性の2列で割当一致率が記録され、M/N・最大クラスタ比率・「その他」比率が数値で記録され、すべての実行で
    metered 認証変数が無く overage の呼び出しが 0 件で、overage_check が passed または unknown である(不可逆、試行は --fresh-run の列で最大
    3 本)。
  risk: high
- id: C-023
  requirement_ids:
  - NFR-8
  statement: 子の CLI にはユーザ設定を読まない指定が渡され、中身検査を通さない直接起動の実測で、最小ホームの .claude/settings.json に一時的に置いた、読まれると呼び出しが失敗する番兵の
    env について、製品の build_argv と一致する argv で、指定なしでは番兵のアドレスへの接続の失敗で呼び出しが失敗し(陰性対照)、指定ありでは成功し、実測後に最小ホームの設定が元のバイト列に戻る(ホストでの実測)。起動前の最小ホームの中身検査は残る。
  risk: high
- id: C-024
  requirement_ids:
  - NFR-8
  statement: 拒否リストを argv から外した状態で、許可リスト(空のものを含む。権限の自動承認の指定は数えない)を渡した子の CLI の init.tools が {StructuredOutput}
    と一致する。--help に現れる有効ツール列挙のフラグのどれでも一致しないことをホストで実測した場合に限り、拒否リストのままで init.tools の一致を満たし、フラグごとの実測記録が残る。
  risk: high
- id: C-027
  requirement_ids:
  - NFR-8
  statement: adapters/llm_anthropic.py が存在せず src と tests から参照されず、既定構成の実行が SDK を読み込まないことのテストが、anthropic
    を import する合成のアダプタを差し込むと赤になる陰性対照とともに緑である(依存 anthropic の削除は次サイクル)。
  risk: medium
tasks:
- id: T-054
  title: 【ホスト】子 CLI のフラグの実測 第1段(ユーザ設定の遮断と有効ツールの許可リスト)
  kind: foundation
  blocked_by: []
  claim_ids:
  - C-023
  - C-024
  domains:
  - measurement
  - security
  risk: high
  scope:
    include:
    - tests/measurements/collect_claude_cli.py
    - tests/measurements/test_claude_cli_flags_logs.py
    - docs/test/measurements/claude-cli-flags.md
  acceptance:
  - id: A-1
    statement: docs/test/measurements/claude-cli-flags.md が、ホストの claude --version の出力と、--help に現れるフラグのうちユーザ設定の読み込み元とツールの有効化に関わるものの名前の一覧を記録している。記録は
      collect_claude_cli.py の flags サブコマンドが書き、合成プロンプトだけを使う。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_claude_cli_flags_logs.py::test_flags_record_lists_version_and_candidate_flags
      executor_profile: quality
      produces:
      - docs/test/measurements/claude-cli-flags.md
  - id: A-2
    statement: 有効ツールの許可リストの候補フラグそれぞれ(空の許可リストと StructuredOutput を明示したもの)について、拒否リストを外した argv での init.tools
      と、--json-schema の構造化出力が返ったかが記録されている。権限の自動承認のフラグ(--allowedTools など)は候補に数えない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_claude_cli_flags_logs.py::test_flags_record_has_init_tools_per_allowlist_candidate
      executor_profile: quality
  - id: A-3
    statement: '記録の末尾の「## 結論」に、次の2行がこの形で書かれている: 「ユーザ設定の遮断: あり(<フラグ>)」または「ユーザ設定の遮断: なし」、「許可リスト: 一致あり(<フラグと値>)」または「許可リスト:
      一致なし」。一致ありは、拒否リストを外した argv で init.tools が {StructuredOutput} と一致し構造化出力が返った候補があることを指す。'
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_claude_cli_flags_logs.py::test_flags_record_states_the_chosen_flags
      executor_profile: quality
  operator_surface: []
  requires:
  - probe:
    - which
    - claude
    says: ホストの PATH に claude(Claude Code CLI)がある
  - probe:
    - python3
    - -c
    - import os,sys; sys.exit(0 if os.path.lexists(os.path.expanduser('~/.quiz-sift-claude-home/.claude/.credentials.json'))
      else 1)
    says: 最小ホーム ~/.quiz-sift-claude-home が用意され、資格情報ファイルがある(HOME=~/.quiz-sift-claude-home claude /login
      を1回。ファイルは開かずに存在だけを見る)
  environment:
    allow:
    - uv run python tests/measurements/collect_claude_cli.py
- id: T-055
  title: 正解を ID の配列にし、M ∈ {4,5,6}・1 ≤ N < M を取り込む(型の切り替え)
  kind: foundation
  blocked_by: []
  claim_ids:
  - C-001
  domains:
  - domain
  - ingest
  risk: high
  scope:
    include:
    - src/quiz_sift/domain/
    - src/quiz_sift/ingest/
    - src/quiz_sift/extract/writer.py
    - src/quiz_sift/cli.py
    - src/quiz_sift/adapters/llm_prompts.py
    - src/quiz_sift/scoring/grade.py
    - src/quiz_sift/server/api.py
    - src/quiz_sift/recall/
    - src/quiz_sift/script/generate.py
    - src/quiz_sift/cluster/summary.py
    - tests/acceptance/test_ingest_and_decks.py
    - tests/acceptance/test_scoring_and_store.py
    - tests/acceptance/conftest.py
    - tests/adapters/test_claude_contract.py
    - tests/adapters/test_claude_failure.py
    - tests/adapters/test_llm_claude_cli.py
    - tests/cluster/
    - tests/domain/
    - tests/extract/
    - tests/ingest/
    - tests/recall/
    - tests/safety/
    - tests/scoring/
    - tests/script/
    - tests/server/
    - tests/fixtures/ingest/
    - tests/support/cli_harness.py
    - tests/measurements/test_extraction_logs.py
    - src/quiz_sift/extract/udemy.py
    - tests/glossary/conftest.py
    - tests/ports/test_protocols.py
    - tests/adapters/test_llm_contract.py
    - tests/test_cli.py
    - tests/nfr8/test_no_metered_sdk.py
    - tests/acceptance/test_cross_cutting.py
    - tests/acceptance/test_audio_and_review.py
    - tests/acceptance/test_analysis.py
    - tests/measurements/test_host_check_logs.py
  acceptance:
  - id: A-1
    statement: 範囲内の (N, M) 12 組すべてを1問以上含む正常系フィクスチャを取り込むと、除外件数が 0 で、各問題の問題文・選択肢 M 件・正解 N 件が欠落なく保持される。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/acceptance/test_ingest_and_decks.py::test_c001_ingest_keeps_every_field_and_lists_rejections
      executor_profile: quality
  - id: A-2
    statement: 範囲外の (N, M)(M=3、M=7、N=0、N=M)、正解の配列が空・重複・選択肢に無い ID を含むもの、ID が重複するものは、問題ごとに理由付きで列挙され、除外件数が報告される。選択肢の件数の理由は
      OPTION_COUNT_UNSUPPORTED。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/acceptance/test_ingest_and_decks.py::test_c001_out_of_range_and_unresolved_answers_are_listed
      executor_profile: quality
  - id: A-3
    statement: 正解を単一の値で持つ旧形式(キー answer)の入力は、取り込み全体が IngestFormatError で止まる。読み替えない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/acceptance/test_ingest_and_decks.py::test_c001_single_answer_input_is_refused
      executor_profile: quality
  - id: A-4
    statement: Question は correct_option_ids(選択肢順・重複なし・1 ≤ N < M を構築時に強制)と answer_count を持つ。N = 1 の問題の既存の挙動(採点・生成・台本)と、HTTP
      API の応答の形(キー名を含む)は変わらず、既存の受入テストは弱めずに緑である。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/domain/test_shared_types.py::test_question_holds_answer_ids_and_rejects_out_of_range
      executor_profile: quality
  - id: A-5
    statement: src と tests の Python の識別子(AST の名前・属性・import する名前・引数名)に correct_option_id・OPTION_COUNT・OPTION_COUNT_NOT_4
      が残らず、取り込みの入力(tests の取り込み用フィクスチャと、テストが書く取り込み用 JSON)にキー "answer" が残らない。HTTP API の応答キーの文字列 "correct_option_id"
      と、想起素材・台本の "answer" は対象外(API のキーの改名は T-065)。検査するテストは名前を組み立てで作り、自分自身を数えない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/domain/test_shared_types.py::test_single_answer_names_are_gone
      executor_profile: quality
  operator_surface:
  - kind: public_interface
    name: 入力ファイルの正解キー answers(選択肢 ID の配列)。旧キー answer は拒否
    paths:
    - src/quiz_sift/ingest/reader.py
    reversible: true
    adr: ADR-020
- id: T-056
  title: タイムアウトをプロセスグループ単位にし、孫が pipe を持っても戻る(SEC-004)
  kind: foundation
  blocked_by:
  - T-055
  claim_ids:
  - C-021
  domains:
  - adapters
  risk: medium
  scope:
    include:
    - src/quiz_sift/adapters/claude_process.py
    - tests/adapters/test_claude_process.py
    - tests/support/grandchild_fake.py
    - tests/acceptance/test_timeout.py
    - src/quiz_sift/cli.py
    - tests/test_cli_sequence.py
  acceptance:
  - id: A-1
    statement: pipe を継承した孫(寿命は 60 秒で打ち切る)を残して眠る fake の子を timeout_sec=1 で走らせると、11 秒未満に Outcome.TIMEOUT
      が返る。テストは run を別スレッドで走らせて join(15) の期限を持ち、修正前のコードでは期限切れで赤になる(無限に待たない)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/acceptance/test_timeout.py::test_c021_timeout_returns_while_grandchild_holds_pipes
      executor_profile: quality
  - id: A-2
    statement: 孫が setsid で新しいセッションに抜けた変種でも、11 秒未満に TIMEOUT が返る(孫の終了までは求めない)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/acceptance/test_timeout.py::test_c021_timeout_returns_when_grandchild_left_the_session
      executor_profile: quality
  - id: A-3
    statement: 子は start_new_session=True で起動され、タイムアウトでプロセスグループに SIGKILL が送られ、猶予は 5 秒(D-186)。親(cli の主スレッドで入れるハンドラ)が
      SIGHUP/SIGTERM を受けたときも、走っている子のグループに killpg してから終わる(D-221)。既存の SIGALRM の経路も killpg する。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/test_cli_sequence.py::test_parent_signal_kills_the_child_group
      executor_profile: quality
  operator_surface: []
- id: T-057
  title: 抽出で 5・6 択と N 件の正解を受け、推定経路を単一選択に限る。ゴールデンセットと再抽出の道具
  kind: parallel
  blocked_by:
  - T-055
  claim_ids:
  - C-002
  domains:
  - extract
  risk: high
  scope:
    include:
    - src/quiz_sift/extract/
    - tests/extract/
    - tests/measurements/test_extraction_logs.py
    - tests/acceptance/test_ingest_and_decks.py
  acceptance:
  - id: A-1
    statement: 選択肢が5件・6件の問題ブロックは抽出され、3件以下・7件以上のブロックは抽出の失敗として列挙される。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/extract/test_udemy.py::test_five_and_six_option_blocks_are_extracted
      executor_profile: quality
  - id: A-2
    statement: 正解マークが N 件(N ≥ 2)ある問題は N 件の正解として抽出され、writer は answers を書く。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/acceptance/test_ingest_and_decks.py::test_c002_marked_answers_become_the_answer_set
      executor_profile: quality
  - id: A-3
    statement: 正解マークが無い問題で受験者の選択を正解とする経路は、選択アイコンが単一選択の形(#icon-radio-* 系)の問題でだけ使われる。複数選択の形(#icon-checkbox-*
      系)と判別できない形は抽出の失敗として列挙される。4択2正解でマークが無く受験者が1件だけ選んだ合成の問題は、N = 1 として素通りしない。
    evidence:
      kind: command
      command:
      - pytest
