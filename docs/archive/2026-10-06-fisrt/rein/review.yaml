  - id: DC-020
    question: 'SEC-001 (sandbox_escape, severity medium): Any process running as the user (or the user
      themself, e.g. via a synced plugin or `claude /login` rewrite) can write child-CLI configuration
      that the preflight does not inspect. The preflight only checks `.claude/CLAUDE.md`, `.claude/rules/`,
      the top-level keys of `.claude/settings.json`, and whether `.credentials.json` exists. `~/.claude.json`,
      the synced `skills/` and `plugins/` trees, and any other settings file the CLI reads are never inspected.
      The check also runs once, before any child is spawned, and the flock is advisory, so the home can
      be modified between preflight and each spawn (TOCTOU). If the attacker adds an `env` or hook-bearing
      config, e.g. `ANTHROPIC_BASE_URL` (measured to take effect under `--safe-mode`, home-probe §2),
      every child reads it. The result is either redirection to a metered or attacker-controlled endpoint
      that receives the study material from stdin, or injected instructions, even though preflight passed.
      What is done about it?'
    risk: medium
    options:
    - id: A
      statement_id: STMT-096
    - id: B
      statement_id: STMT-097
    - id: C
      statement_id: STMT-098
    - id: D
      statement_id: STMT-099
    evidence:
      finding:
        id: SEC-001
        severity: medium
        category: sandbox_escape
        attack_scenario: Any process running as the user (or the user themself, e.g. via a synced plugin
          or `claude /login` rewrite) can write child-CLI configuration that the preflight does not inspect.
          The preflight only checks `.claude/CLAUDE.md`, `.claude/rules/`, the top-level keys of `.claude/settings.json`,
          and whether `.credentials.json` exists. `~/.claude.json`, the synced `skills/` and `plugins/`
          trees, and any other settings file the CLI reads are never inspected. The check also runs once,
          before any child is spawned, and the flock is advisory, so the home can be modified between
          preflight and each spawn (TOCTOU). If the attacker adds an `env` or hook-bearing config, e.g.
          `ANTHROPIC_BASE_URL` (measured to take effect under `--safe-mode`, home-probe §2), every child
          reads it. The result is either redirection to a metered or attacker-controlled endpoint that
          receives the study material from stdin, or injected instructions, even though preflight passed.
        code_anchors:
        - path: src/quiz_sift/adapters/claude_process.py
          start_line: 100
          end_line: 148
          blob: git-blob:949d55dd0dd57e6366e367dacd842a86164b6a9d
        blocking: false
        status: open
        first_seen:
          trusted_base_sha: c7b1d84a0ed8a8562fc4708e5c1031bc66e98cf5
          subject_head_sha: 68951688ba8d813ab6707b1720cf80d1265bd8a8
      expected_choice: revise_implementation
    requires_domains:
    - security
  - id: DC-021
    question: 'SEC-002 (sandbox_escape, severity medium): Tools are restricted by an enumerated deny list
      (`permissions.deny`), not an allow list, and the check that only `StructuredOutput` is enabled (`_tool_problem`)
      runs only after the child has exited. Quiz text scraped from Udemy is untrusted and goes to the
      model on stdin. If a future `claude` release adds a read-only or no-permission tool not in `DENIED_TOOLS`,
      an injected instruction in a question can make the model call it, for example to read `~/.quiz-sift-claude-home/.claude/.credentials.json`
      or other local files. The call executes during the run. `classify` only marks the invocation PROVIDER_ERROR
      afterwards, and by then the tool output is already in stdout, which is written to the INFO log.
      What is done about it?'
    risk: medium
    options:
    - id: A
      statement_id: STMT-100
    - id: B
      statement_id: STMT-101
    - id: C
      statement_id: STMT-102
    - id: D
      statement_id: STMT-103
    evidence:
