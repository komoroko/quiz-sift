      executor_profile: quality
  - id: A-8
    statement: check_entailment は llm_contract の判定語パーサを通る。未知の判定語は CONSISTENT にならない。check_entailment の呼び出しが PARSE / SCHEMA / TIMEOUT / PROVIDER_ERROR / TRUNCATED のどれで失敗しても、CONSISTENT は返らず、safety.entailment.emit_if_consistent は成果物を書かない(fail-closed。C-013、AR-147)。
    evidence:
