    statement: '手で組んだ3実行ぶんの開始行・終了行に対する集約で、次の値が手計算の期待値と一致する。和: llm_calls / provider_invocations / model_turns / turns_by_model / tokens / tokens_by_model / invocations_without_usage / invocations_without_turns / failures_by_kind / overage_invocations / invocations_without_rate_limit_event。最大: max_concurrency。時間: elapsed_sec_sum と wall_clock_sec。estimated_cost: computed と declared はそれぞれ和で、relative_diff は和から計算し直す。status: recorded はすべての実行が recorded のときだけで、notional: true と disclaimer が付く。レート枠: quota(実行ごとの {execution_id, at_start, at_end})と quota_missing。overage_check は和から判定する。metered_env_names は和集合。'
