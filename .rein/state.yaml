            の exhausted の一致の assert が一度も効いていない。再現: regeneration_counts の `n == MAX_REGENERATIONS` を `n
            > MAX_REGENERATIONS` に変える(常に 0 になる)か、`assert int(summary[label][0]) == exhausted` の行を消す。どちらでも
            test_d246_record_shows_regenerations_without_the_thinking_env を含む全テストが緑のまま通る。『再生成のあった問題の数』の側も同じで、`n
            > 0` を `n > 1` に変えても全問 0 のデータでは区別がつかない(+1 の改変で見ているのは要約の行と問題ごとの表の不一致だけで、数え方の誤りは見ていない)。直す方向:
            0 以外の値と上限の値を含む入力(例 [0, 1, 2, 2] → (3, 2))で regeneration_counts を固定し、加えて、問題ごとの表の1行を上限の値に書き換えた記録、または上限の数の行だけを
            +1 した記録で、『作り直しを上限まで使った問題の数が表と違う』が赤になることを _broken で確かめる。'
