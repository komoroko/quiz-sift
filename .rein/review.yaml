  - id: DC-019
    question: 'SEC-001 (sandbox_escape, severity medium): The preflight is the only barrier that keeps
      configuration out of the `claude` child. It checks only `.claude/CLAUDE.md`, `.claude/rules/` and
      the top-level keys of `.claude/settings.json` under the minimal home. The home probe measured that
      HOME-side settings can inject `env` (for example ANTHROPIC_BASE_URL) even under `--safe-mode`. The
      preflight does not look at `.claude/settings.local.json` or `$HOME/.claude.json` in the same home.
      Someone who can write one of those files (another local tool, a synced plugin, a careless edit)
      can set env such as ANTHROPIC_BASE_URL or ANTHROPIC_AUTH_TOKEN, or hooks. That redirects every study-material
      prompt to a server they control, or moves the calls onto a metered path, and the preflight still
      passes. Not verified on the host whether the CLI reads settings.local.json from HOME under --safe-mode.
      What is done about it?'
    risk: medium
