      - -q
      - tests/measurements/test_claude_cli_logs.py::test_init_tools_is_exactly_structured_output
      executor_profile: quality
  - id: A-4
    statement: 採取時の状態として、次の3点が記録されている。HOME を最小ホームに向けたこと。親環境に metered 認証変数を1つも持たないこと(変数名の一覧だけを書き、値は書かない)。最小ホームのファイル一覧(採取の前後。相対パスだけ)。合成プロンプト以外の本文はフィクスチャに含まれない。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_claude_cli_logs.py::test_collection_ran_in_the_minimal_home_without_metered_vars
      executor_profile: quality
  - id: A-5
    statement: 2件の success フィクスチャのそれぞれに、rate_limit_event が1件以上あり、status が allowed / allowed_warning のどちらかで、isUsingOverage が false である。meta の試行回数は3以下である。3回採り直しても現れなければ、実装者は needs-revision で止め、(h) の証拠の形を人が /revise で決める(D-133)。
    evidence:
      kind: command
      command:
      - pytest
      - -q
      - tests/measurements/test_claude_cli_logs.py::test_success_fixtures_carry_a_rate_limit_event
