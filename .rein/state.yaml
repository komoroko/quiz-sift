        session: 4cf569d8-c65c-4822-b6c8-43e0082ac524
        output_tail: 'T-069 は止めました。人の判断が要るので、`needs-revision` と knowledge-gap(risk: high)を記録してあります。


          **原因**: 実 CosyVoice を読み込む段階でプローブが落ちました。製品の audio 段も同じ理由で動かない状態です。

          - pyproject の `constraint-dependencies = ["setuptools>=83"]`(D-165、PYSEC-2026-3447 への対策)により、venv
          の setuptools は 84.0.0 です。この版には `pkg_resources` がありません。

          - CosyVoice の `cosyvoice/dataset/processor.py` は `pyworld` を読み込み、`pyworld` 0.3.5(uv.lock の版)は冒頭で
          `import pkg_resources` を実行します。ここで `ModuleNotFoundError` になります。

          - torch 2.10.0+cu128、CUDA、重み、CosyVoice のチェックアウトは揃っています。止まった原因は依存の組み合わせだけです。


          **判断が要る点**: 直すには依存の変更が要り、T-069 の scope(プローブの道具、記録、テスト)の外です。選択肢は3つあります。

          1. `pkg_resources` を使わない pyworld に替える。0.3.5 より新しい版があるかは確認していません。無ければフォークか別の実装になります。

          2. setuptools を `pkg_resources` のある版に戻す。D-165 のセキュリティ判断を覆すことになります。

          3. CosyVoice 側で pyworld を読み込まないようにする。


          プローブだけに `pkg_resources` の代わりを足せば記録は通せますが、製品の audio 段が壊れたまま緑になるので、その方法は採りませんでした。


          **現状**: 前回の中断分(`probe.py`、`script.json`、`test_tts_probe_logs.py`)は変更なしで残っています。このセッションで変えたものはありません。記録
          `docs/test/measurements/tts-probe.md` はまだ無いため、A-1・A-2 は赤のままです。依存が直れば、次のコマンドで記録を書けます。


          ```

          PYTHONPATH=src:/home/koich/CosyVoice:/home/koich/CosyVoice/third_party/Matcha-TTS .venv/bin/python
          tests/fixtures/tts-probe/probe.py --tts-model /home/koich/CosyVoice/pretrained_models/CosyVoice-300M-SFT
          --out /tmp/tts-probe

          ```


          T-069 はフル処理(T-071)のリハーサルにあたるので、この問題を解くまでフル処理には進めません。'
        at: '2026-10-07T19:09:09+09:00'
