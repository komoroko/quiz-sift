    - docs/test/measurements/claude-cli-contract.md
    - docs/test/measurements/claude-cli-home-probe.md
  acceptance:
  - id: A-1
    statement: tests/fixtures/claude_cli/ に、--safe-mode 付きの設計 argv で実 CLI から採取した生の stdout 3件がある。内訳は、success(claude-haiku-4-5)、success_opus(claude-opus-5-5)、invalid_schema(不正な --json-schema。stdout は空)。それぞれに .meta.yaml があり、採取日・claude --version の出力・モデル・argv 全体・合成プロンプト全文・stdout の sha256・終了コード・stderr・採取の試行回数を持つ。
