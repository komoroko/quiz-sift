- id: D-124
  subject: 枠切れで止まり再開した実測を「フル処理1回」とどう数えるか
  reach: mandate
  status: settled
  settled_by: human
  answer: 同じ run_id で連なる実行の列を1回と数え、合算する。初回は段キャッシュを迂回し、再開は段キャッシュから。途中の実行が非 0 終了してよいのはレート枠による PROVIDER_ERROR
    だけで、それ以外の失敗が1つでもあれば完走に数えない。完走は最後の実行が exit 0。回数・トークン・コスト・失敗件数は和、並行度は最大、経過時間は実行時間の和と最初の開始から最後の終了までの壁時計の両方、使用率と
    resetsAt は各実行の開始時と終了時をすべて記録する。(f) の metered 変数なしは全実行に課す。
